    if (rich > 0) {
      for (const [gx, gy, gr, rgb, level] of [[.1, .25, .46, "255,80,170", .2], [.9, .08, .5, "90,130,255", .2], [.5, -.25, .6, "170,90,255", .18], [.82, .85, .38, "255,120,190", .15], [.18, .9, .36, "100,170,255", .12]]) {
        const glow = c.createRadialGradient(gx * W, gy * H, 0, gx * W, gy * H, gr * Math.max(W, H));
        glow.addColorStop(0, `rgba(${rgb},${level * rich})`);
        glow.addColorStop(1, `rgba(${rgb},0)`);
        c.fillStyle = glow;
        c.fillRect(0, top, W, H - top);
      }
    }
  }

  // Крупные цветные звёзды мягко мерцают вокруг Луны. Они и выше сцены, чтобы продолжиться за вазой
  function drawFinaleGlints(c, W, H, t, rich, cell) {
    if (rich <= 0) return;
    for (const s of finale.glints) {
      const shine = rich * (.35 + .65 * Math.abs(Math.sin(t * s.sp + s.ph)));
      c.fillStyle = s.color;
      c.globalAlpha = shine * .28;
      c.beginPath();
      c.arc(s.x * W, s.y * H, cell * s.size * 1.7, 0, 6.2832);
      c.fill();
      c.globalAlpha = shine;
      c.beginPath();
      c.arc(s.x * W, s.y * H, cell * s.size * .7, 0, 6.2832);
      c.fill();
    }
    c.globalAlpha = 1;
  }

  function drawFinaleMoon(c, x, y, radius, turn, t, cell) {
    const pulse = .85 + .15 * Math.sin(t * .0016);
    const halo = c.createRadialGradient(x, y, radius * .88, x, y, radius * 1.62);
    halo.addColorStop(0, `rgba(255, 206, 236, ${.42 * pulse})`);
    halo.addColorStop(.4, `rgba(190, 170, 255, ${.16 * pulse})`);
    halo.addColorStop(1, "rgba(150, 140, 240, 0)");
    c.fillStyle = halo;
    c.fillRect(x - radius * 1.7, y - radius * 1.7, radius * 3.4, radius * 3.4);
    c.save();
    c.translate(x, y);
    c.rotate(turn);
    c.drawImage(finale.moon, -radius, -radius, radius * 2, radius * 2);
    c.restore();
    // Светлый ободок с одной стороны делает диск объёмным
    const rim = c.createLinearGradient(x - radius, y - radius, x + radius, y + radius);
    rim.addColorStop(0, "rgba(255, 244, 232, .95)");
    rim.addColorStop(.55, "rgba(255, 220, 240, .1)");
    rim.addColorStop(1, "rgba(255, 220, 240, 0)");
    c.strokeStyle = rim;
    c.lineWidth = Math.max(1.5, cell);
    c.beginPath();
    c.arc(x, y, radius * .995, 0, 6.2832);
    c.stroke();
  }

  function renderFinale(pr, t) {
    const { W, H, cols, rows, cell, fontPx, noise, glyphW, glyphH } = finale;
    if (!W || !rows) return;
    prepareFinaleTextures(Infinity);
    const c = finaleLowCtx, target = finaleCtx;
    c.setTransform(cols / W, 0, 0, rows / H, 0, 0);
    c.globalAlpha = 1;
    c.fillStyle = "#000";
    c.fillRect(0, 0, W, H);

    const press = ease(clamp((pr - .05) / .07));
    const dark = ease(clamp((pr - .08) / .09));
    const lift = ease(clamp((pr - .15) / .3));
    const handIn = ease(clamp(pr / .05)) * (1 - ease(clamp((pr - .12) / .07)));
    const ceilingFade = ease(clamp((pr - .26) / .1));

    // Стена уезжает вниз, как будто камера поднимается
    if (lift < 1) {
      c.save();
      c.translate(0, lift * H * 1.75);
      const { lensX, lensY, S } = drawProjectorWall(c, W, H, dark, press);
      if (handIn > 0) {
        // Рука с пальцем нажимает на корпус, её подсвечивает проектор
        const tipX = lensX - S * .02 + (1 - handIn) * -S * .7, tipY = lensY + S * .34 + (1 - handIn) * S * .55;
        const palmX = tipX - S * .24, palmY = tipY + S * .15;
        const skin = mix(.86, 1.2, press);
        const tone = (r, g, b) => `rgb(${Math.min(255, r * skin) | 0},${Math.min(255, g * skin) | 0},${Math.min(255, b * skin) | 0})`;
        c.lineCap = "round";
        // Запястье уходит за край кадра и темнеет к низу
        const wrist = c.createLinearGradient(palmX, palmY, palmX - S * .5, palmY + S * .55);
        wrist.addColorStop(0, tone(206, 138, 100));
        wrist.addColorStop(1, tone(120, 66, 44));
        c.strokeStyle = wrist;
        c.lineWidth = S * .17;
        c.beginPath();
        c.moveTo(palmX, palmY);
        c.lineTo(palmX - S * .62, palmY + S * .72);
        c.stroke();
        // Ладонь
        c.fillStyle = tone(214, 148, 110);
        c.beginPath();
        c.ellipse(palmX, palmY, S * .135, S * .105, -.75, 0, 6.2832);
        c.fill();
        // Согнутые пальцы и указательный, который нажимает на корпус
        c.strokeStyle = tone(226, 164, 124);
        c.lineWidth = S * .05;
        c.beginPath();
        c.moveTo(palmX + S * .06, palmY - S * .06);
        c.lineTo(tipX, tipY);
        c.stroke();
        c.strokeStyle = tone(198, 132, 96);
        for (const [dx, dy] of [[.13, .02], [.12, .08], [.08, .13]]) {
          c.beginPath();
          c.moveTo(palmX + S * dx * .35, palmY + S * dy * .35);
          c.quadraticCurveTo(palmX + S * dx * 1.2, palmY + S * dy * .7, palmX + S * dx * .95, palmY + S * dy * 1.3);
          c.stroke();
        }
        c.fillStyle = tone(240, 196, 168);
        c.beginPath();
        c.ellipse(tipX, tipY, S * .02, S * .014, -.8, 0, 6.2832);
        c.fill();
        if (press > 0) {
          const lit = c.createRadialGradient(tipX, tipY, 0, tipX, tipY, S * .3);
          lit.addColorStop(0, `rgba(255, 190, 90, ${.75 * press})`);
          lit.addColorStop(1, "rgba(255, 160, 60, 0)");
          c.fillStyle = lit;
          c.fillRect(tipX - S * .3, tipY - S * .3, S * .6, S * .6);
        }
      }
      // Из линзы по стене разлетаются звёзды, как только гаснет свет
      const bloom = ease(clamp((pr - .08) / .1));
      if (bloom > 0) {
        for (const s of finale.stars) {
          const sx = lensX + (s.x - .5) * W * 2.3 * bloom, sy = lensY + (s.y - .55) * H * 2.3 * bloom;
          c.globalAlpha = bloom * (.5 + .5 * Math.abs(Math.sin(t * s.sp + s.ph))) * (1 - ceilingFade);
          c.fillStyle = s.color;
          c.fillRect(sx, sy, cell, H / rows);
        }
        c.globalAlpha = 1;
      }
      // Конус света уходит вверх из линзы
      if (dark > 0) {
        const beamTop = lensY - H * 2.4;
        const beam = c.createLinearGradient(0, lensY, 0, beamTop);
        beam.addColorStop(0, `rgba(235, 225, 255, ${.5 * dark})`);
        beam.addColorStop(.5, `rgba(180, 170, 230, ${.16 * dark})`);
        beam.addColorStop(1, "rgba(160, 150, 220, 0)");
        c.fillStyle = beam;
        c.beginPath();
        c.moveTo(lensX - S * .04, lensY);
        c.lineTo(lensX + S * .04, lensY);
        c.lineTo(lensX + W * .9, beamTop);
        c.lineTo(lensX - W * .9, beamTop);
        c.closePath();
        c.fill();
        // Пылинки медленно поднимаются в луче
        for (const mote of finale.motes) {
          const up = (mote.along + t * mote.speed) % 1;
          const my = lensY - up * H * 1.3;
          const mx = lensX + mote.side * up * W * .5 + Math.sin(t * .001 + mote.ph) * cell * 2;
          c.globalAlpha = dark * Math.sin(up * Math.PI) * .85;
          c.fillStyle = "#fff4e6";
          c.fillRect(mx, my, cell, H / rows);
        }
        c.globalAlpha = 1;
      }
      c.restore();
    }

    // Потолок выплывает сверху
    const ceiling = ease(clamp((pr - .28) / .22));
    if (ceiling > 0) {
      drawFinaleSky(c, W, H, pr, ceiling, 0);
      c.globalAlpha = 1;
      drawFinaleGlints(c, W, H, t, ease(clamp((pr - .78) / .22)), cell);
      for (const s of finale.stars) {
        c.fillStyle = s.color;
        c.globalAlpha = ceiling * (.45 + .55 * Math.abs(Math.sin(t * s.sp + s.ph)));
        const size = (s.big ? 1.6 : 1) * cell;
        c.fillRect(Math.floor(s.x * cols) * cell, Math.floor(((s.y + (1 - ceiling) * -.6 + 2) % 1) * rows) * (H / rows), size, s.big ? size : H / rows);
      }
      c.globalAlpha = 1;
    }

    // Полосы звёзд на быстром подъёме
    const rush = Math.sin(clamp((pr - .2) / .32) * Math.PI);
    if (rush > .02) {
      c.lineCap = "butt";
      for (const streak of finale.streaks) {
        const y = ((streak.y + pr * streak.speed * 5) % 1) * H * 1.2 - H * .1;
        const x = streak.x * W + (y - H / 2) * .28;
        c.strokeStyle = `rgba(${streak.tint},${rush * streak.glow})`;
        c.lineWidth = Math.max(1, cell * .75);
        c.beginPath();
        c.moveTo(x, y);
        c.lineTo(x - rush * H * .05, y - rush * H * .17 * streak.speed);
        c.stroke();
      }
    }

    // Падающая звезда на потолке
    if (ceiling > .9) {
      const life = (t % 3800) / 900;
      if (life < 1) {
        const startX = W * (.1 + .5 * ((Math.floor(t / 3800) * .618) % 1)), startY = H * .08;
        const fall = ease(life);
        const headX = startX + fall * W * .34, headY = startY + fall * H * .28;
        const trail = c.createLinearGradient(headX, headY, headX - W * .09, headY - H * .075);
        trail.addColorStop(0, `rgba(255, 255, 255, ${Math.sin(life * Math.PI)})`);
        trail.addColorStop(1, "rgba(255, 196, 228, 0)");
        c.strokeStyle = trail;
        c.lineWidth = Math.max(1, cell);
        c.beginPath();
        c.moveTo(headX, headY);
        c.lineTo(headX - W * .09, headY - H * .075);
        c.stroke();
      }
    }
    // Созвездие-сердце вспыхивает по звезде и гаснет, когда Луна приближается
    const heartIn = clamp((pr - .55) / .13), heartOut = 1 - ease(clamp((pr - .8) / .08));
    if (heartIn > 0 && heartOut > 0) {
      const hs = Math.min(W, H) * .15, hx = W * (W > H ? .23 : .27), hy = H * .25;
      const lit = Math.floor(heartIn * finale.constellation.length);
      c.strokeStyle = `rgba(255, 150, 205, ${.5 * heartOut})`;
      c.lineWidth = Math.max(1, cell * .5);
      c.beginPath();
      finale.constellation.slice(0, lit + 1).forEach(([ux, uy], i) => {
        if (i) c.lineTo(hx + ux * hs, hy + uy * hs);
        else c.moveTo(hx + ux * hs, hy + uy * hs);
      });
      if (lit >= finale.constellation.length) c.closePath();
      c.stroke();
      c.fillStyle = "#ffffff";
      finale.constellation.slice(0, lit + 1).forEach(([ux, uy], i) => {
        c.globalAlpha = heartOut * (.7 + .3 * Math.sin(t * .004 + i));
        c.fillRect(hx + ux * hs - cell / 2, hy + uy * hs - cell / 2, cell * 1.4, H / rows * 1.2);
      });
      c.globalAlpha = 1;
    }

    // Луна входит справа и затем заполняет экран
    const moonIn = ease(clamp((pr - .5) / .2));
    if (moonIn > 0) {
      const zoom = ease(clamp((pr - .72) / .28));
      const small = Math.min(W * .34, H * .3), big = Math.min(W * .58, H * .62);
      const radius = mix(small, big, zoom);
      const x = mix(W * 1.5, W * .63, moonIn) + (W * .5 - W * .63) * zoom + Math.sin(t * .00022) * W * .004;
      const y = mix(H * .42, H * .44, zoom) + Math.cos(t * .00018) * H * .004;
      drawFinaleMoon(c, x, y, radius, .12 + zoom * .1 + t * .000012, t, cell);
    }

    // Перевод сцены в цветные символы
    if (finaleGL) {
      finaleGL.draw(finaleLow, { cols, rows, band: .82, glyphScale: (H / rows) / (fontPx * .86), minLight: .04, solid: 1 });
      return;
    }
    const pixels = c.getImageData(0, 0, cols, rows).data;
    target.fillStyle = "#000";
    target.fillRect(0, 0, W, H);
    const rowH = H / rows, bandH = rowH * .82;
    // Соседние ячейки одного цвета заливаются одним прямоугольником: так заметно быстрее
    let lastColor = -1;
    for (let y = 0; y < rows; y++) {
      const py = y * rowH;
      let runStart = -1, runColor = -1;
      const flush = end => {
        if (runStart < 0) return;
        if (runColor !== lastColor) {
          target.fillStyle = `rgb(${(runColor >> 10 & 31) << 3},${(runColor >> 5 & 31) << 3},${(runColor & 31) << 3})`;
          lastColor = runColor;
        }
        target.fillRect(runStart * cell, py, (end - runStart) * cell + .5, bandH);
        runStart = -1;
      };
      for (let x = 0; x < cols; x++) {
        const at = (y * cols + x) * 4;
        const r = pixels[at], g = pixels[at + 1], b = pixels[at + 2];
        const light = (r * .3 + g * .59 + b * .11) / 255;
        if (light < .04) {
          flush(x);
          continue;
        }
        const color = (r >> 3 << 10) | (g >> 3 << 5) | (b >> 3);
        if (color !== runColor || runStart < 0) {
          flush(x);
          runStart = x;
          runColor = color;
        }
      }
      flush(cols);
      for (let x = 0; x < cols; x++) {
        const at = (y * cols + x) * 4;
        const light = (pixels[at] * .3 + pixels[at + 1] * .59 + pixels[at + 2] * .11) / 255;
        if (light < .04) continue;
        const level = Math.min(RAMP.length - 1, Math.max(1, Math.round((1 - light) * (RAMP.length - 2)) + 2 + noise[y * cols + x]));
        target.drawImage(finaleGlyphs, level * glyphW, 0, glyphW, glyphH, x * cell, py, cell, fontPx * .86);
      }
    }
  }

  const FINALE_SPEED = .08, FINALE_SNAP = 900;
  function updateFinale(now, dt) {
    const box = finaleSection.getBoundingClientRect(), viewH = landing.clientHeight;
    // Сцену нельзя проскочить: страница сама встаёт на неё и закрывается для прокрутки до конца анимации
    if (!still && !finale.done && !finale.lockedAt && box.top <= viewH * .3) {
      finale.lockedAt = now;
      finale.snapFrom = landing.scrollTop;
      landing.style.overflowY = "hidden";
    }
    if (!finale.lockedAt && (box.bottom < -viewH || box.top > viewH * 2)) return;
    sizeFinale();
    if (still) {
      finale.shown = 1;
      finaleSection.classList.add("done");
    } else if (finale.lockedAt) {
      const snap = ease(clamp((now - finale.lockedAt) / FINALE_SNAP));
      landing.scrollTop = mix(finale.snapFrom, landing.scrollTop + box.top, snap);
      if (snap >= 1) {
        finale.shown = Math.min(1, finale.shown + FINALE_SPEED * dt);
        if (finale.shown >= 1) {
          finale.done = true;
          finale.lockedAt = 0;
          finaleSection.classList.add("done");
          landing.style.overflowY = "";
          finaleHint.style.opacity = "1";
        }
      }
    }
    // За экраном сцена не рисуется: хватает одного кадра про запас
    if (finale.last && !finale.lockedAt && (box.top >= viewH || box.bottom <= 0)) return;
    // До начала сцены стена неподвижна: кадр не зависит от времени и уже нарисован
    if (finale.last && !finale.shown) return;
    if (now - finale.last < (finale.lockedAt ? 30 : 100)) return;
    finale.last = now;
    renderFinale(finale.shown, now);
    const note = ease(clamp((finale.shown - .9) / .08));
    finaleNote.style.opacity = String(note);
    finaleNote.style.visibility = note > 0 ? "visible" : "hidden";
  }

  /* ===== Переход от букета к Луне: ваза на полке у той же стены ===== */
  // Букет стоит в вазе, за ним из темноты проступает стена, с которой начинается сцена проектора.
  // Холст собран из той же сетки символов и лежит вплотную над финалом, поэтому стыка не видно.
  const bridgeCanvas = $("flowerBridge"), bridgeGL = photoGL && makeAsciiGL(bridgeCanvas), bridgeCtx = bridgeGL ? null : bridgeCanvas.getContext("2d");
  const bridgeLow = document.createElement("canvas");
  const bridgeLowCtx = bridgeLow.getContext("2d", { willReadFrequently: true });
  const bridgeGlyphs = document.createElement("canvas");
  const BRIDGE_PETALS = ["#e0463c", "#a148c9", "#eee7da", "#d8c850", "#ff9cc4", "#d9b79c"];
  const flowerBridge = { W: 0, H: 0, gap: 0, last: 0, cols: 0, rows: 0, cell: 0, fontPx: 0, glyphW: 0, glyphH: 0, over: 0, noise: null, falling: [], fallen: [] };

  function sizeBridge(finaleBox) {
    const b = flowerBridge, gap = finaleBox.top - bouquetCanvas.getBoundingClientRect().bottom;
    if (!finaleBox.width || (finaleBox.width === b.W && Math.abs(gap - b.gap) < 1)) return;
    const scale = Math.min(window.devicePixelRatio || 1, 1.5);
    b.over = Math.min(260, landing.clientHeight * .34);
    b.W = finaleBox.width;
    b.H = gap + b.over;
    b.gap = gap;
    b.last = 0;
    b.night = null;
    bridgeCanvas.style.height = `${b.H}px`;
    bridgeCanvas.width = Math.round(b.W * scale);
    bridgeCanvas.height = Math.round(b.H * scale);
    b.cols = b.W > 900 ? 196 : b.W > 500 ? 150 : 96;
    b.cell = b.W / b.cols;
    b.fontPx = b.cell / .6;
    b.rows = Math.floor(b.H / b.fontPx);
    bridgeLow.width = b.cols;
    bridgeLow.height = b.rows;
    const glyphs = makeGlyphAtlas(b.cell, b.fontPx, scale, bridgeGlyphs);
    b.glyphW = glyphs.glyphW;
    b.glyphH = glyphs.glyphH;
    b.noise = Int8Array.from({ length: b.cols * b.rows }, () => Math.floor(rnd(-1, 2)));
    b.falling = Array.from({ length: 34 }, () => ({ x: Math.random(), ph: Math.random(), speed: rnd(.00005, .00011), sway: rnd(0, 6.28), size: rnd(1.6, 3.2), spin: rnd(-.002, .002), color: pick(BRIDGE_PETALS) }));
    b.fallen = Array.from({ length: 11 }, () => ({ x: rnd(-.46, .46), size: rnd(1.6, 2.8), turn: rnd(-.5, .5), color: pick(BRIDGE_PETALS) }));
    if (bridgeGL) bridgeGL.setAtlas(bridgeGlyphs);
    else bridgeCtx.setTransform(scale, 0, 0, scale, 0, 0);
  }

  function drawLoosePetal(c, x, y, size, turn, color) {
    c.save();
    c.translate(x, y);
    c.rotate(turn);
    c.fillStyle = color;
    c.beginPath();
    c.ellipse(0, 0, size, size * .55, 0, 0, 6.2832);
    c.fill();
    c.restore();
  }

  const VASE_HEART = [".XXX.XXX.", "XXXXXXXXX", ".XXXXXXX.", "...XXX...", "....X...."];
  function drawVase(c, cx, top, bottom, cell, rowH, shade, t) {
    const h = bottom - top, w = h * .62, neck = w * .2;
    const tone = (r, g, b) => `rgb(${r * shade | 0},${g * shade | 0},${b * shade | 0})`;
    const body = c.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
    body.addColorStop(0, tone(255, 176, 207));
    body.addColorStop(.42, tone(255, 93, 160));
    body.addColorStop(1, tone(150, 26, 88));
    c.fillStyle = body;
    c.beginPath();
    c.moveTo(cx - neck, top);
    c.bezierCurveTo(cx - neck, top + h * .24, cx - w / 2, top + h * .3, cx - w / 2, top + h * .58);
    c.bezierCurveTo(cx - w / 2, top + h * .84, cx - w * .26, bottom, cx - w * .2, bottom);
    c.lineTo(cx + w * .2, bottom);
    c.bezierCurveTo(cx + w * .26, bottom, cx + w / 2, top + h * .84, cx + w / 2, top + h * .58);
    c.bezierCurveTo(cx + w / 2, top + h * .3, cx + neck, top + h * .24, cx + neck, top);
    c.closePath();
    c.fill();
    // Светлый блик на боку
    c.fillStyle = tone(255, 226, 238);
    c.beginPath();
    c.ellipse(cx - w * .39, top + h * .58, w * .03, h * .13, .06, 0, 6.2832);
    c.fill();
    // Горлышко и золотая лента
    c.fillStyle = tone(255, 150, 196);
    c.fillRect(cx - neck * 1.3, top, neck * 2.6, Math.max(cell, h * .05));
    c.fillStyle = tone(255, 215, 154);
    c.fillRect(cx - neck * 1.12, top + h * .17, neck * 2.24, Math.max(cell, h * .055));
    // Пиксельное сердце ровно по сетке символов, иначе оно расплывается в пятно
    const startX = Math.round((cx - cell * 4.5) / cell) * cell, startY = Math.round((top + h * .42) / rowH) * rowH;
    const beat = .5 + .5 * Math.sin(t * .0042);
    c.fillStyle = tone(255, mix(176, 244, beat), mix(208, 250, beat));
    VASE_HEART.forEach((row, y) => [...row].forEach((mark, x) => {
      if (mark === "X") c.fillRect(startX + x * cell, startY + y * rowH, cell, rowH);
    }));
  }

  function renderBridge(t) {
    const b = flowerBridge, { W, H, cols, rows, cell, fontPx, noise, glyphW, glyphH, over } = b;
    if (!rows) return;
    const c = bridgeLowCtx, target = bridgeCtx;
    c.setTransform(cols / W, 0, 0, rows / H, 0, 0);
    c.clearRect(0, 0, W, H);
    // До Луны за вазой стена из начала сцены. После неё та же Луна и то же небо продолжаются вверх,
    // так что букет стоит на их фоне и между цветами и Луной нет пустоты
    const night = finale.shown >= 1 && finale.moon, stageH = finale.H || landing.clientHeight, cx = W / 2;
    if (night) {
      c.fillStyle = "#000";
      c.fillRect(0, 0, W, H);
      c.save();
      c.translate(0, H);
      drawFinaleSky(c, W, stageH, 1, 1, -H);
      c.globalAlpha = 1;
      drawFinaleGlints(c, W, stageH, t, 1, cell);
      c.restore();
      for (const s of finale.stars) {
        c.fillStyle = s.color;
        c.globalAlpha = .45 + .55 * Math.abs(Math.sin(t * s.sp + s.ph));
        c.fillRect(Math.floor(s.x * cols) * cell, Math.floor(s.y * rows) * (H / rows), cell, H / rows);
      }
      c.globalAlpha = 1;
      const radius = Math.min(W * .58, stageH * .62);
      drawFinaleMoon(c, W * .5 + Math.sin(t * .00022) * W * .004, H + stageH * .44 + Math.cos(t * .00018) * stageH * .004, radius, .22 + t * .000012, t, cell);
    } else {
      const wall = c.createRadialGradient(W * .46, H + stageH * .46, 0, W * .46, H + stageH * .46, Math.max(W, stageH) * .8);
      wall.addColorStop(0, "rgb(196,158,112)");
      wall.addColorStop(1, "rgb(112,86,60)");
      c.fillStyle = wall;
      c.fillRect(0, 0, W, H);
    }
    // Сверху фон плавно темнеет и уходит в ночное небо
    const neckY = over - 6, shelfH = Math.max(10, H / rows * 2), shelfY = H - Math.max(44, Math.max(0, Math.min(W * .58, stageH * .62) - stageH * .44) + stageH * .22);
    const fullY = neckY + (shelfY - neckY) * .3, fade = c.createLinearGradient(0, 0, 0, fullY);
    for (let i = 0; i <= 6; i++) fade.addColorStop(i / 6, `rgba(0, 0, 0, ${1 - ease(i / 6)})`);
    c.fillStyle = fade;
    c.fillRect(0, 0, W, fullY);

    // Полка с тенью
    const shade = night ? .82 : 1, wallLight = night ? 0 : 1, shelfW = Math.min(W * .78, 760);
    const shadow = c.createLinearGradient(0, shelfY + shelfH, 0, shelfY + shelfH * 3.4);
    shadow.addColorStop(0, `rgba(30, 14, 6, ${.5 * wallLight})`);
    shadow.addColorStop(1, "rgba(30, 14, 6, 0)");
    c.fillStyle = shadow;
    c.fillRect(cx - shelfW / 2, shelfY + shelfH, shelfW, shelfH * 2.4);
    c.fillStyle = `rgb(${236 * shade | 0},${206 * shade | 0},${170 * shade | 0})`;
    c.fillRect(cx - shelfW / 2, shelfY, shelfW, shelfH * .45);
    c.fillStyle = `rgb(${132 * shade | 0},${84 * shade | 0},${52 * shade | 0})`;
    c.fillRect(cx - shelfW / 2, shelfY + shelfH * .45, shelfW, shelfH * .55);
    drawVase(c, cx, neckY, shelfY, cell, H / rows, shade, t);
    // Лепестки, которые уже опали на полку
    for (const petal of b.fallen) drawLoosePetal(c, cx + petal.x * shelfW, shelfY - cell * .4, petal.size * cell, petal.turn, petal.color);
    // Лепестки медленно падают с букета мимо вазы и тают у самого низа
    for (const petal of b.falling) {
      const life = (t * petal.speed + petal.ph) % 1, y = life * H;
      const x = petal.x * W + Math.sin(t * .0009 + petal.sway) * W * .025;
      c.globalAlpha = clamp(life * 6) * clamp((1 - life) * 8);
      drawLoosePetal(c, x, y, petal.size * cell, t * petal.spin + petal.sway, petal.color);
    }
    c.globalAlpha = 1;

    if (bridgeGL) {
      // Щели между строками стены тёмные, иначе сквозь них просвечивают метеоры с неба
      bridgeGL.draw(bridgeLow, { cols, rows, band: .82, glyphScale: (H / rows) / (fontPx * .86), minLight: .04, gapSolid: 1 });
      return;
    }
    const pixels = c.getImageData(0, 0, cols, rows).data;
    target.clearRect(0, 0, W, H);
    const rowH = H / rows, bandH = rowH * .82;
    let lastColor = -1;
    for (let y = 0; y < rows; y++) {
      const py = y * rowH;
      for (let x = 0; x < cols; x++) {
        const at = (y * cols + x) * 4;
        const r = pixels[at], g = pixels[at + 1], blue = pixels[at + 2];
        const light = (r * .3 + g * .59 + blue * .11) / 255;
        if (pixels[at + 3] < 60 || light < .04) continue;
        const color = (r >> 3 << 10) | (g >> 3 << 5) | (blue >> 3);
        if (color !== lastColor) {
          target.fillStyle = `rgb(${(r >> 3) << 3},${(g >> 3) << 3},${(blue >> 3) << 3})`;
          lastColor = color;
        }
        target.fillRect(x * cell, py, cell + .5, bandH);
        const level = Math.min(RAMP.length - 1, Math.max(1, Math.round((1 - light) * (RAMP.length - 2)) + 2 + noise[y * cols + x]));
        target.drawImage(bridgeGlyphs, level * glyphW, 0, glyphW, glyphH, x * cell, py, cell, fontPx * .86);
      }
    }
  }

  function updateBridge(now) {
    const finaleBox = finaleSection.getBoundingClientRect(), viewH = landing.clientHeight;
    if (finaleBox.top > viewH * 3) return;
    sizeBridge(finaleBox);
    // Переход лежит над сценой с Луной и не виден, пока она занимает экран.
    // Один кадр всё же рисуем при смене фона: при прокрутке вверх не мелькнёт старая стена
    const night = finale.shown >= 1, sameBack = flowerBridge.night === night;
    if (finaleBox.top - flowerBridge.H > viewH || (finaleBox.top <= 1 && sameBack)) return;
    if (now - flowerBridge.last < 60 || (still && flowerBridge.last && sameBack)) return;
    flowerBridge.last = now;
    flowerBridge.night = night;
    renderBridge(now);
  }

  // Лепестки, тихо падающие вокруг розы в финале
  const fallingPetals = Array.from({ length: 34 }, () => ({
    x: Math.random(), y: Math.random(), speed: rnd(.00002, .00005), ph: rnd(0, 6.28), big: Math.random() < .35
  }));
  function drawFallingPetals(t, alpha) {
    if (alpha <= 0 || still) return;
    for (const petal of fallingPetals) {
      const y = ((petal.y + t * petal.speed) % 1) * H;
      const x = petal.x * W + Math.sin(t * .0008 + petal.ph) * 18 * dpr;
      ctx.globalAlpha = alpha * .75;
      ctx.fillStyle = petal.big ? "#ff5da0" : "#ffb4d0";
      ctx.fillRect(Math.round(x / p) * p, Math.round(y / p) * p, p * (petal.big ? 2 : 1), p);
    }
    ctx.globalAlpha = 1;
  }

  function drawParticles(T, t) {
    const ratio = .3 + .015 * Math.sin(t * .001);
    const inRose = T >= TO_ROSE;
    const roseIn = clamp((T - TO_ROSE) / 1400);
    const cosYaw = Math.cos(yaw.x), sinYaw = Math.sin(yaw.x);
    const cosPitch = Math.cos(pitch.x), sinPitch = Math.sin(pitch.x);
    const cosLean = Math.cos(lean.x), sinLean = Math.sin(lean.x);
    const fineCell = Math.max(1, Math.round(p * .75));
    const appear = ease(clamp((T - TO_DISC + DISC_BLEND) / DISC_BLEND));

    drawHaze(ease(clamp((T - TO_DISC + 300) / 1600)) * (1 - clamp((T - TO_NAME) / 900)), disc.x, disc.y, disc.r * 1.7);
    drawHaze(roseIn, rose.x, rose.y - rose.r * .55, rose.r * 2.4);
    drawFallingPetals(t, clamp((T - TO_ROSE - 1200) / 1200));
    drawDiscDust(T, t, ratio);

    // Плотная основа имени: частицы дают блеск, основа — чёткость букв
    if (nameLayer && T > TO_NAME) {
      const shown = ease(clamp((T - TO_NAME - 700) / 1300)) * (1 - clamp((T - TO_ROSE) / 500));
      if (shown > 0) {
        ctx.globalAlpha = shown * .85;
        ctx.drawImage(nameLayer.canvas, 0, nameLayer.y);
        ctx.globalAlpha = 1;
      }
    }

    // Плотная основа подписи под розой
    for (const layer of finalLayers) {
      const shown = clamp((T - layer.from) / 900);
      if (shown <= 0) continue;
      ctx.globalAlpha = shown * .85;
      ctx.drawImage(layer.canvas, 0, layer.y);
    }
    ctx.globalAlpha = 1;

    for (const part of parts) {
      // В розе диск уже не участвует: синус и косинус на каждую частицу не нужны
      let dx = 0, dy = 0;
      if (!inRose) {
        const spin = part.da + t * part.dw, r = disc.r * part.dr;
        dx = disc.x + Math.cos(spin) * r;
        dy = disc.y + Math.sin(spin) * r * ratio;
      }
      let x, y, color = part.hot, size = p, alpha = appear;

      if (T < TO_NAME) {
        const e = ease(clamp((T - TO_DISC + 200 - part.d0) / 2000));
        x = mix(ox + part.cellX * p, dx, e);
        y = mix(oy + part.cellY * p, dy, e);
      } else {
        const e2 = ease(clamp((T - TO_NAME - part.d1) / 1300));
        x = mix(dx, part.nx, e2);
        y = mix(dy, part.ny, e2);
        if (e2 > .6) color = part.pale;
        // Собравшиеся буквы блестят мелкими точками поверх чёткой основы
        if (e2 > .95) size = Math.max(1, Math.round(p * .5));
        if (inRose) {
          size = p;
          const e3 = ease(clamp((T - TO_ROSE - part.d2) / 1900));
          const puff = Math.sin(e3 * Math.PI) * part.burst * rose.r * .55;
          let rx = part.rx, ry = part.ry;
          if (part.kind !== "small") {
            // Поворот вокруг стебля; бутон ещё и наклонён к зрителю, чтобы была видна спираль лепестков
            const x1 = part.lx * cosYaw + part.lz * sinYaw, z1 = part.lz * cosYaw - part.lx * sinYaw;
            let x2 = x1, y2 = part.ly, z2 = z1;
            if (part.kind === "head") {
              const tipped = part.ly * cosPitch - z1 * sinPitch;
              z2 = z1 * cosPitch + part.ly * sinPitch;
              // Бутон клонится от верхушки стебля
              x2 = x1 * cosLean + tipped * sinLean + lean.x * .5;
              y2 = tipped * cosLean - x1 * sinLean;
            } else {
              // Стебель стоит внизу и плавно изгибается к бутону
              const fromTop = 1 - clamp(-part.ly / STEM_LENGTH);
              x2 = x1 + lean.x * .5 * fromTop * fromTop;
            }
            rx = rose.x + x2 * rose.r;
            ry = rose.y - y2 * rose.r;
            part.qx = rx;
            part.qy = ry;
            // Дальняя сторона темнее: так глаз читает лепестки как объём
            if (e3 > .6) alpha = .38 + .62 * clamp((z2 + .8) / 1.6);
            size = fineCell;
          }
          x = mix(part.nx, rx, e3) + Math.cos(part.burstAngle) * puff;
          y = mix(part.ny, ry, e3) + Math.sin(part.burstAngle) * puff * .9 - puff * .45;
          if (e3 > .35) color = part.rc;
          if (part.kind === "small") size = Math.max(1, Math.round(p * .5));
        }
      }
      if (alpha <= 0) continue;
      if (part.tw && !still && Math.sin(t * part.sp + part.ph) > .6) alpha *= .35;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), size, size);
    }
    ctx.globalAlpha = 1;

    // Искры на буквах имени и на бутоне
    if (T > TO_NAME + 900 && !still) {
      const onRose = T > TO_ROSE + 900;
      const count = onRose ? 5 : 12;
      for (let i = 0; i < count; i++) {
        const part = parts[COUNT - 1 - i * 37];
        const phase = (t * .0007 + i * .37) % 1;
        const glow = Math.sin(phase * Math.PI);
        if (T > TO_ROSE && !onRose) continue;
        const x = onRose ? part.qx : part.nx, y = onRose ? part.qy : part.ny;
        drawSparkle(x, y, Math.round((3 + 5 * glow) * dpr), glow * .95);
      }
      // Такие же искры на подписи, как на большом имени
      if (T > SHOW_TEXT + 600) {
        for (let i = 0; i < 7; i++) {
          const part = parts[i * 41];
          const glow = Math.sin(((t * .0007 + i * .29) % 1) * Math.PI);
          drawSparkle(part.rx, part.ry, Math.round((2 + 4 * glow) * dpr), glow * .95);
        }
      }
    }
  }

  /* ===== Сцены ===== */
  const INTRO = 4400, SHOW_INVITE = 3500;
  let butterflyExit = -1;
  let scene = still ? "idle" : "butterflies", sceneStart = 0, lastFrame = 0;

  function heartbeat(t) {
    if (still) return 1;
    const phase = (t % 2600) / 2600;
    if (phase < .08) return 1 + .1 * Math.sin(phase / .08 * Math.PI);
    if (phase > .13 && phase < .21) return 1 + .07 * Math.sin((phase - .13) / .08 * Math.PI);
    return 1;
  }

  function leaveButterflies(now) {
    butterflyExit = now;
    // Запоминаем, где сейчас бабочки; рисование поверх прячется следующим кадром
    const spots = [];
    ctx.save();
    ctx.globalAlpha = 0;
    drawHeartFlock(now - sceneStart, now, 0, spots);
    ctx.restore();
    flockSpots = spots;
    setScene("assembling", now);
  }

  function setScene(next, now) {
    scene = next;
    sceneStart = now;
  }

  function syncStoryText(T) {
    forWhom.classList.toggle("faded", T < SHOW_TEXT + 600);
    finalName.classList.toggle("faded", T < SHOW_TEXT);
    $("seal").classList.toggle("faded", T < SHOW_TEXT + 900);
    replayBtn.classList.toggle("gone", T < SHOW_REPLAY);
    toLandingBtn.classList.toggle("gone", T < SHOW_REPLAY);
    backBtn.classList.toggle("gone", T < 700);
  }

  function updateSky(T, dt) {
    warp = 0;
    if (still) return;
    if (scene === "story") {
      warpX = disc.x;
      warpY = disc.y;
      warp = -.26 * Math.sin(Math.PI * clamp((T - TO_DISC + 800) / 2800)) + .34 * Math.sin(Math.PI * clamp((T - TO_ROSE) / 1500));
      if (Math.abs(warp) < .002) warp = 0;
    }
    if (scene === "landing") {
      const top = landingTop;
      const speed = dt > 0 ? (top - lastScrollTop) / dt : 0;
      lastScrollTop = top;
      scrollSpeed += (speed - scrollSpeed) * Math.min(1, dt * 8);
      scrollShift = top * dpr;
    } else {
      scrollSpeed = 0;
      scrollShift = 0;
    }
  }

  // Пороги стоят между тиками экрана, поэтому ритм ровный: 60 Гц даёт 60 и 30 кадров, 120 Гц даёт 60 и 40
  const FAST_GAP = 11, CALM_GAP = 21;
  let busyUntil = 0, skyCovered = false, awayChecked = 0;
  function calmSky(now, T) {
    // Прокрутка, курсор, искры, проявление фото и рост букета идут в полной частоте
    if (now < busyUntil || pressed || SPARKS.length) return false;
    if (still || scene === "idle") return true;
    if (scene === "landing") return T >= BRIDGE_FADE && !finale.lockedAt;
    return scene === "story" && T > SHOW_REPLAY + 1000;
  }

  function frame(now) {
    // Пока у окна нет размера, сцены не начинаются
    if (!W || !H) {
      sceneStart = lastFrame = now;
      requestAnimationFrame(frame);
      return;
    }
    const T = now - sceneStart;
    // Лишний тик экрана: ничего не считаем и не рисуем
    if (now - lastFrame < (calmSky(now, T) ? CALM_GAP : FAST_GAP)) {
      requestAnimationFrame(frame);
      return;
    }
    // Луна идёт по настоящим часам, а за кадр больше четверти секунды она не прыгает
    const elapsed = Math.min(.25, (now - lastFrame) / 1000), dt = Math.min(.033, elapsed);
    lastFrame = now;
    prepareFinaleTextures(3);
    updateMotion(dt, now);
    updateSky(T, dt);
    const bob = still ? 0 : Math.round(Math.sin(now / 1000) * 1.4) * p;
    // Сцена с Луной закрыла окно целиком: небо за ней не видно, холст не трогаем.
    // Один чистый кадр при входе, чтобы в полосе прокрутки не застыл кусок метеора
    let covered = false;
    if (scene === "landing") {
      const stage = finaleSection.getBoundingClientRect();
      covered = stage.top <= 1 && stage.bottom >= landing.clientHeight - 1;
      // Страховка, если браузер не прислал событие прокрутки: иначе блок на экране остался бы без анимаций и граней карт
      if (now - awayChecked > 300) {
        awayChecked = now;
        pauseAway();
      }
    }
    if (!covered || !skyCovered) {
      // Холст непрозрачный: браузеру не нужно смешивать его с фоном страницы
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#020204";
      ctx.fillRect(0, 0, W, H);
      drawStars(now);
    }
    skyCovered = covered;
    if (scene === "story") drawMeteors(T, ease(clamp((T - TO_DISC + 500) / 1300)) * (1 - ease(clamp((T - TO_NAME) / 1300))), smallMeteors, bigMeteors);
    if (scene === "landing" && !covered) drawLandingMeteors(now, T);

    if (scene === "butterflies") {
      drawHeartFlock(T, now, 0);
      if (T >= BUTTERFLY_HOLD) leaveButterflies(now);
    } else if (scene === "assembling") {
      // Бабочки ещё разлетаются, пока навстречу им слетаются пиксели письма
      if (butterflyExit >= 0) {
        const exit = clamp((now - butterflyExit) / BUTTERFLY_EXIT);
        if (exit < 1) drawHeartFlock(BUTTERFLY_HOLD, now, exit);
      }
      envelopeHalo(clamp((T / INTRO - .7) / .3));
      drawEnvelope(now, bob, { gather: clamp(T / INTRO), tint: butterflyExit >= 0 ? 1 - ease(clamp((T / INTRO - .25) / .6)) : 0 });
      if (T >= SHOW_INVITE) showInvite();
      if (T >= INTRO) setScene("idle", now);
    } else if (scene === "idle") {
      envelopeHalo(1);
      drawEnvelope(now, bob, { beat: heartbeat(now) });
      if (!still) drawCornerGlints(now, bob);
    } else if (scene === "story") {
      if (T < TO_DISC) {
        const leaving = 1 - ease(clamp((T - TO_DISC + DISC_BLEND) / DISC_BLEND));
        envelopeHalo((1 - ease(clamp(T / 2400))) * leaving);
        drawEnvelope(now, bob, {
          beat: T < 420 ? 1 + .16 * Math.sin(Math.PI * T / 420) : 1,
          seal: ease(clamp((T - 380) / 1000)),
          theta: Math.PI * ease(clamp((T - 420) / 2400)),
          tint: ease(clamp((T - 1000) / 2200)),
          fade: leaving
        });
        drawStream(T, bob, ease(clamp((T - 420) / 900)) * leaving);
      }
      if (T >= TO_DISC - DISC_BLEND) drawParticles(T, now);
      if (!still) {
        // Взрыв имени в розу прикрыт кольцом
        const toRose = (T - TO_ROSE) / 1400;
        if (toRose > 0 && toRose < 1) drawShockRing(W / 2, H * .46, toRose);
      }
      syncStoryText(T);
      if (T > TO_ROSE + 1000) drawCalmFlyers(now, ease(clamp((T - TO_ROSE - 1000) / 2200)), false);
    } else if (scene === "bridge") {
      drawHaze(1 - clamp(T / BRIDGE), rose.x, rose.y - rose.r * .55, rose.r * 2.4);
      drawFallingPetals(now, .7);
      for (const layer of finalLayers) {
        const shown = (1 - clamp(T / 350)) * .85;
        if (shown <= 0) break;
        ctx.globalAlpha = shown;
        ctx.drawImage(layer.canvas, 0, layer.y);
      }
      ctx.globalAlpha = 1;
      drawBridge(T, 1);
      if (T >= BRIDGE) showLanding(now);
    } else if (scene === "landing") {
      if (!covered) {
        drawFallingPetals(now, .32);
        if (!still && T < BRIDGE_FADE) drawBridge(BRIDGE, 1 - T / BRIDGE_FADE);
        drawThread(1);
        drawCalmFlyers(now, .62, true);
      }
      updateAsciiPhotos(now);
      updateBouquet(now);
      updateFinale(now, elapsed);
      updateBridge(now);
    }
    // Под закрытой сценой след не виден: искры не копятся и не держат полную частоту
    if (covered) SPARKS.length = 0;
    else drawSparks(now, dt);
    requestAnimationFrame(frame);
  }

  function showInvite() {
    caption.classList.remove("gone");
    openBtn.classList.remove("gone");
  }

  function startStory() {
    if (scene === "story") return;
    pressed = false;
    caption.classList.add("gone");
    openBtn.classList.add("gone");
    dedication.classList.remove("gone");
    placeTargets();
    const now = performance.now();
    setScene("story", still ? now - SHOW_REPLAY - 1 : now);
  }

  /* ===== Мост от розы к лендингу: частицы текут вверх и складываются в большое имя ===== */
  const BRIDGE = 2100, BRIDGE_FADE = 900;
  function prepareBridge() {
    const hero = landing.querySelector(".hero-name");
    const box = hero.getBoundingClientRect();
    const sampled = sampleText(CONFIG.name, parseFloat(getComputedStyle(hero).fontSize) * dpr, W / 2, (box.top + box.height / 2) * dpr, PIXEL);
    for (const part of parts) {
      part.fromX = part.kind === "small" ? part.rx : part.qx;
      part.fromY = part.kind === "small" ? part.ry : part.qy;
      const target = sampled.points.length ? pick(sampled.points) : [W / 2, H / 2];
      part.bx = target[0];
      part.by = target[1];
    }
  }
  function drawBridge(T, alpha) {
    const cell = Math.max(1, Math.round(p * .5));
    for (const part of parts) {
      const e = ease(clamp((T - part.d2 * .5) / (BRIDGE - 275)));
      const swirl = Math.sin(e * Math.PI) * part.burst * H * .08;
      const x = mix(part.fromX, part.bx, e) + Math.cos(part.burstAngle) * swirl;
      const y = mix(part.fromY, part.by, e) + Math.sin(part.burstAngle) * swirl;
      ctx.globalAlpha = alpha * (part.tw && Math.sin(T * part.sp + part.ph) > .6 ? .4 : 1);
      ctx.fillStyle = part.pale;
      ctx.fillRect(Math.round(x), Math.round(y), cell, cell);
    }
    ctx.globalAlpha = 1;
  }

  function showLanding(now) {
    landing.classList.remove("gone");
    progress.classList.remove("gone");
    progressCat.classList.remove("gone");
    landing.focus({ preventScroll: true });
    revealVisible();
    pauseAway();
    lastScrollTop = landing.scrollTop;
    setScene("landing", now);
  }

  function openLanding() {
    dedication.classList.add("gone");
    backBtn.classList.add("gone");
    landing.scrollTop = 0;
    const now = performance.now();
    if (still) {
      showLanding(now);
      return;
    }
    prepareBridge();
    setScene("bridge", now);
  }

  function replay() {
    finale.shown = 0;
    finale.done = false;
    finale.last = 0;
    finale.lockedAt = 0;
    finaleSection.classList.remove("done");
    landing.style.overflowY = "";
    finaleHint.style.opacity = "0";
    finaleNote.style.opacity = "0";
    finaleNote.style.visibility = "hidden";
    // Лендинг при следующем проходе снова проявляется по прокрутке, видео не играют за кадром
    landing.querySelectorAll(".reveal").forEach(el => el.classList.remove("in"));
    hiddenBlocks = still ? [] : [...landing.querySelectorAll(".reveal")];
    landing.querySelectorAll("video").forEach(video => {
      video.pause();
      video.currentTime = 0;
    });
    resetBouquet();
    resetAsciiPhotos();
    dealMemory();
    landing.classList.add("gone");
    pauseAway();
    progress.classList.add("gone");
    progressCat.classList.add("gone");
    toLandingBtn.classList.add("gone");
    dedication.classList.add("gone");
    replayBtn.classList.add("gone");
    backBtn.classList.add("gone");
    forWhom.classList.add("faded");
    finalName.classList.add("faded");
    $("seal").classList.add("faded");
    pointerNear = false;
    if (still) showInvite();
    butterflyExit = -1;
    flockSpots = [];
    setScene(still ? "idle" : "butterflies", performance.now());
  }

  // Кнопка в углу сразу переводит к следующему шагу истории.
  // Шаг назад по истории: от розы к имени, от имени к воронке, от воронки к конверту
  function stepBack() {
    if (scene !== "story") return;
    const now = performance.now(), T = now - sceneStart;
    if (T < TO_NAME) {
      dedication.classList.add("gone");
      backBtn.classList.add("gone");
      setScene("idle", now);
      showInvite();
      return;
    }
    sceneStart = now - (T >= TO_ROSE ? TO_NAME : TO_DISC);
  }

  /* ===== Звук: на сайте играет только одна мелодия ===== */
  const MUSIC_LEVEL = .85;
  let soundOn = false, music = null, playAttempt = 0;
  if (CONFIG.music) {
    music = new Audio(CONFIG.music);
    music.preload = "auto";
    music.preservesPitch = false;
    music.playbackRate = CONFIG.musicSpeed;
    music.addEventListener("error", () => { music = null; });
    // Когда мелодия заканчивается, она мягко начинается сначала
    music.addEventListener("ended", () => {
      music.currentTime = 0;
      music.volume = 0;
      music.play().catch(() => {});
    });
  }
  // Мягкое появление и затухание: запись начинается и обрывается резко
  setInterval(() => {
    if (!music || music.paused || !music.duration) return;
    const left = music.duration - music.currentTime;
    if (music.currentTime > 1.6 && left > 1.8 && music.volume === MUSIC_LEVEL) return;
    music.volume = MUSIC_LEVEL * clamp(Math.min(music.currentTime / 1.4, left / 1.6));
  }, 90);

  function toggleSound() {
    if (!music) return;
    soundOn = !soundOn;
    const attempt = ++playAttempt;
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    if (!soundOn) {
      music.pause();
      return;
    }
    music.play().catch(() => {
      if (attempt !== playAttempt) return;
      soundOn = false;
      soundBtn.setAttribute("aria-pressed", "false");
    });
  }
  /* ===== События ===== */
  function overEnvelope(event) {
    const x = event.clientX * dpr, y = event.clientY * dpr;
    return x >= ox && x <= ox + GW * p && y >= oy && y <= oy + GH * p;
  }

  function trackPointer(event) {
    pointer.x = (event.clientX * dpr - ox) / p;
    pointer.y = (event.clientY * dpr - oy) / p;
    pointer.sx = event.clientX * dpr;
    pointer.sy = event.clientY * dpr;
  }

  openBtn.addEventListener("click", startStory);
  replayBtn.addEventListener("click", replay);
  $("replayEnd").addEventListener("click", replay);
  toLandingBtn.addEventListener("click", openLanding);
  backBtn.addEventListener("click", stepBack);
  soundBtn.addEventListener("click", toggleSound);
  addEventListener("pointermove", event => {
    busyUntil = performance.now() + 500;
    trackPointer(event);
    pointerNear = true;
    addTrail(event.clientX * dpr, event.clientY * dpr);
  });
  document.documentElement.addEventListener("mouseleave", () => { pointerNear = false; });
  sky.addEventListener("pointerdown", event => {
    trackPointer(event);
    pointerNear = true;
    // Вмятина начинается точно под пальцем, а не тянется от прошлого положения
    soft.headX = soft.tailX = pointer.x;
    soft.headY = soft.tailY = pointer.y;
    if (scene !== "idle" || !overEnvelope(event)) return;
    pressed = true;
    sky.setPointerCapture(event.pointerId);
  });
  // Конверт открывается при отпускании, чтобы успел спружинить обратно.
  sky.addEventListener("pointerup", event => {
    if (event.pointerType !== "mouse") pointerNear = false;
    if (!pressed) return;
    pressed = false;
    if (overEnvelope(event)) setTimeout(startStory, still ? 0 : 340);
  });
  sky.addEventListener("pointercancel", () => { pressed = false; });
  addEventListener("resize", layout);
  addEventListener("pointerdown", event => {
    // Тап по небу рассыпает сердечки
    if (event.target === sky || event.target.closest(".btn") || landing.contains(event.target) && !event.target.closest("button, video")) burstHearts(event.clientX * dpr, event.clientY * dpr);
  });
  // Палец могут отпустить где угодно, в том числе над кнопкой
  addEventListener("pointerup", event => { if (event.pointerType !== "mouse") pointerNear = false; });
  addEventListener("pointercancel", () => { pointerNear = false; });
  document.addEventListener("visibilitychange", () => {
    if (!music || !soundOn) return;
    if (document.hidden) music.pause();
    else music.play().catch(() => {});
  });
  // Встроенное окно меняет размер и без события resize.
  new ResizeObserver(() => {
    if (Math.floor(innerWidth * dpr) !== W || Math.floor(innerHeight * dpr) !== H) {
      layout();
      pauseAway();
    }
  }).observe(document.documentElement);

  buildEnvelope();
  buildParticles();
  // Заставка использует то же небо и тот же звездопад, что верх лендинга.
  let startActive = true, startSkyLastFrame = 0, startSkyBegan = null;
  function drawStartSky(now) {
    if (!startActive) return;
    requestAnimationFrame(drawStartSky);
    if (!W || !H || now - startSkyLastFrame < CALM_GAP) return;
    if (startSkyBegan === null) startSkyBegan = now;
    startSkyLastFrame = now;
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#020204";
    ctx.fillRect(0, 0, W, H);
    drawStars(now);
    drawLandingMeteors(now, now - startSkyBegan);
  }
  requestAnimationFrame(drawStartSky);
  $("startButton").addEventListener("click", () => {
    toggleSound();
    startActive = false;
    $("startScreen").remove();
    $("corner").classList.remove("gone");
    if (still) showInvite();
    requestAnimationFrame(now => {
      lastFrame = sceneStart = now;
      frame(now);
    });
  });
  layout();
  // Имя собирается из шрифтов, поэтому после их загрузки цели пересчитываются.
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('80px "Great Vibes"', CONFIG.name + CONFIG.forWhom), document.fonts.load('40px "Press Start 2P"')]).then(layout, () => {});
  }
</script>
