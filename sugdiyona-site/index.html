      card.type = "button";
      card.style.setProperty("--i", i);
      card.className = "mem-card";
      card.dataset.photo = photo;
      card.setAttribute("aria-label", `Карта ${i + 1}`);
      const inner = document.createElement("span");
      inner.className = "mem-inner";
      const back = document.createElement("span");
      back.className = "mem-back";
      const heart = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      heart.setAttribute("shape-rendering", "crispEdges");
      pixelIcon(heart, HEART);
      back.append(heart);
      const face = document.createElement("span");
      face.className = "mem-face";
      const image = document.createElement("img");
      image.src = `photos/${photo}`;
      image.alt = "";
      face.append(image);
      inner.append(back, face);
      card.append(inner);
      card.addEventListener("click", () => flipMemory(card));
      return card;
    }));
  }
  function flipMemory(card) {
    if (memoryLocked || card.classList.contains("open")) return;
    card.classList.add("open");
    memoryOpen.push(card);
    if (memoryOpen.length < 2) return;
    const [first, second] = memoryOpen;
    memoryOpen = [];
    if (first.dataset.photo === second.dataset.photo) {
      first.classList.add("found");
      second.classList.add("found");
      popAround(first, 6);
      popAround(second, 6);
      memoryFound += 1;
      if (memoryFound === MEMORY_PHOTOS.length) {
        memoryWin.textContent = CONFIG.texts.memoryWin;
        memoryGrid.parentElement.classList.add("won");
        popAround(memoryGrid, 30);
      }
      return;
    }
    memoryLocked = true;
    setTimeout(() => {
      first.classList.remove("open");
      second.classList.remove("open");
      memoryLocked = false;
    }, 850);
  }
  dealMemory();

  // Блоки проявляются, когда их верх заходит в окно: прямая проверка при каждой прокрутке,
  // чтобы ни один блок не остался невидимым, если какой-то браузер не пришлёт событие наблюдателя.
  let hiddenBlocks = still ? [] : [...landing.querySelectorAll(".reveal")];
  if (hiddenBlocks.length) landing.classList.add("js-reveal");
  function revealVisible() {
    const limit = landing.clientHeight * .92;
    hiddenBlocks = hiddenBlocks.filter(el => {
      if (el.getBoundingClientRect().top >= limit) return true;
      el.classList.add("in");
      return false;
    });
  }
  let landingTop = 0;
  landing.addEventListener("scroll", () => {
    busyUntil = performance.now() + 250;
    const room = landing.scrollHeight - landing.clientHeight;
    landingTop = landing.scrollTop;
    const share = room > 0 ? landingTop / room : 0;
    progress.style.transform = `scaleX(${share})`;
    moveCat(share);
    revealVisible();
    pauseAway();
  }, { passive: true });
  addEventListener("resize", revealVisible);
  // Что далеко за краем окна, не анимируем. Прямая проверка при прокрутке, как у revealVisible
  const AWAY_MARGIN = 240, awayBlocks = [...landing.querySelectorAll(".page > *")];
  function pauseAway() {
    const hidden = landing.classList.contains("gone"), viewH = landing.clientHeight;
    for (const el of awayBlocks) {
      const box = el.getBoundingClientRect();
      el.classList.toggle("away", hidden || box.bottom < -AWAY_MARGIN || box.top > viewH + AWAY_MARGIN);
    }
  }
  pauseAway();
  addEventListener("resize", pauseAway);

  const makeLayer = () => ({ buckets: new Map(), glow: [], seen: new Set() });
  // tip и under: пиксели под сердцем и надписью, они видны только в открытом конверте.
  const layers = {
    flap: makeLayer(), tip: makeLayer(), front: makeLayer(), under: makeLayer(),
    rim: makeLayer(), seal: makeLayer(), label: makeLayer()
  };
  const mask = new Set();
  const key = (x, y) => x + "," + y;

  function plot(layer, x, y, color, opts = {}) {
    const k = key(x, y);
    if (layer.seen.has(k)) return;
    layer.seen.add(k);
    const angle = rnd(0, Math.PI * 2), speed = rnd(.25, 1);
    // Интро: сначала прилетает пыль, потом рамка и складки, в конце сердце и надпись
    const arrival = layer === layers.seal ? rnd(.42, .56) : layer === layers.label ? rnd(.3, .5) : opts.glow ? rnd(.14, .38) : rnd(0, .3);
    const px = {
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      side: Math.floor(rnd(0, 4)),
      along: Math.random(),
      spot: Math.floor(rnd(0, 100000)),
      arrival,
      tw: !!opts.twinkle,
      ph: rnd(0, 6.28),
      sp: rnd(.0015, .005)
    };
    if (!layer.buckets.has(color)) layer.buckets.set(color, []);
    layer.buckets.get(color).push(px);
    if (opts.glow) layer.glow.push(px);
  }

  // Клапан — всё выше линии V, остальное остаётся на передней стенке.
  function shell(x, y) {
    const inFlap = y <= topLine(x) + 1;
    if (mask.has(key(x, y))) return inFlap ? layers.tip : layers.under;
    return inFlap ? layers.flap : layers.front;
  }

  function line(x0, y0, x1, y1, colors, opts) {
    const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
    for (let i = 0; i <= steps; i++) {
      const x = Math.round(x0 + (x1 - x0) * i / steps);
      const y = Math.round(y0 + (y1 - y0) * i / steps);
      for (const dx of [0, 1]) plot(shell(x + dx, y), x + dx, y, pick(colors), opts);
    }
  }

  function buildEnvelope() {
    // Надпись и сердце: сначала они, чтобы оставить вокруг них чистое поле.
    const textCells = [];
    let cursor = 47;
    for (const ch of "FOR YOU") {
      if (ch === " ") { cursor += 14; continue; }
      GLYPHS[ch].forEach((row, r) => [...row].forEach((bit, c) => {
        if (bit !== "1") return;
        for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) textCells.push([cursor + c * 3 + i, 95 + r * 3 + j]);
      }));
      cursor += 19;
    }
    textCells.forEach(([x, y]) => {
      plot(layers.label, x, y, Math.random() < .05 ? "#c9c3da" : "#f4f1fa");
      for (let i = -3; i <= 3; i++) for (let j = -3; j <= 3; j++) mask.add(key(x + i, y + j));
    });
    // Жёсткая пиксельная тень под буквами
    textCells.forEach(([x, y]) => plot(layers.label, x + 1, y + 1, "#b5532e"));

    const hx = MID - 11, hy = 66;
    const filled = (r, c) => HEART[r] && HEART[r][c] === "X";
    HEART.forEach((row, r) => [...row].forEach((cell, c) => {
      if (cell !== "X") return;
      const edge = !filled(r - 1, c) || !filled(r + 1, c) || !filled(r, c - 1) || !filled(r, c + 1);
      for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
        const x = hx + c * 2 + i, y = hy + r * 2 + j;
        const shine = !edge && r <= 2 && c >= 2 && c <= 3;
        const color = shine ? "#ffffff" : edge ? "#ff4fa3" : ((x + y) % 3 === 0 ? "#fff0f8" : "#ffc6e4");
        plot(layers.seal, x, y, color);
        for (let a = -3; a <= 3; a++) for (let b = -3; b <= 3; b++) mask.add(key(x + a, y + b));
      }
    }));

    // Рамка
    const rimColors = ["#ffd79a", "#ffd79a", "#ffd79a", "#fff4df", "#f39a4b"];
    const edgeOpts = { glow: true, twinkle: true };
    for (let x = 0; x < GW; x++) for (const y of [0, 1, GH - 2, GH - 1]) plot(shell(x, y), x, y, pick(rimColors), edgeOpts);
    for (let y = 0; y < GH; y++) for (const x of [0, 1, GW - 2, GW - 1]) plot(shell(x, y), x, y, pick(rimColors), edgeOpts);

    // Складки: верхние сходятся в одну точку, это и есть острый кончик клапана
    const creamy = ["#fff1da", "#ffe6c2"], tan = ["#e8b878", "#f0c88e"];
    const creaseOpts = { glow: true };
    line(2, 2, 109, 78, creamy, creaseOpts);
    line(216, 2, 109, 78, creamy, creaseOpts);
    line(2, GH - 3, 79, 70, tan, creaseOpts);
    line(216, GH - 3, 139, 70, tan, creaseOpts);
    // Тень под клапаном: он читается как отдельный слой бумаги
    const fold = ["#6e3a1e", "#7a4424"];
    line(2, 4, 109, 80, fold);
    line(216, 4, 109, 80, fold);

    // Край кармана виден, когда клапан уже поднят
    for (let x = 2; x < GW - 2; x++) plot(layers.rim, x, Math.round(topLine(x)), "#e8b878");

    // Оранжевая пиксельная пыль внутри конверта
    const dust = ["#e8894a", "#e8894a", "#f2b36b", "#b5643a", "#8a4a2c"];
    for (let y = 3; y < GH - 3; y += 2) {
      for (let x = 3; x < GW - 3; x++) {
        const inFlap = y <= topLine(x);
        const inBottom = y > APEX + (GH - APEX) * (1 - Math.abs(x - MID) / MID);
        const density = inFlap ? .15 : inBottom ? .05 : .12;
        if (Math.random() > density) continue;
        const length = 1 + Math.floor(Math.random() * 3);
        const color = pick(dust);
        const twinkle = Math.random() < .18;
        for (let i = 0; i < length; i++) {
          if (x + i >= GW - 2) continue;
          plot(shell(x + i, y), x + i, y, color, { twinkle });
        }
      }
    }
  }

  /* ===== Раскладка и звёзды ===== */
  let dpr = 1, p = 2, ox = 0, oy = 0, stars = [], W = 0, H = 0;

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vw = innerWidth, vh = innerHeight;
    // Окно может стартовать с нулевым размером: сборка конверта начинается, когда размер появился.
    const wasEmpty = !W || !H;
    W = sky.width = Math.floor(vw * dpr);
    H = sky.height = Math.floor(vh * dpr);
    if (wasEmpty && W && H && scene === "butterflies") sceneStart = performance.now();
    const target = Math.min(vw - 32, vw * .8, (vh - 150) * GW / GH, 480);
    p = Math.max(1, Math.floor(target * dpr / GW));
    slot.style.width = GW * p / dpr + "px";
    slot.style.height = GH * p / dpr + "px";
    const box = slot.getBoundingClientRect();
    ox = Math.round(box.left * dpr);
    oy = Math.round(box.top * dpr);

    const count = Math.min(900, Math.floor(vw * vh / 1500));
    stars = Array.from({ length: count }, () => ({
      x: rnd(0, W),
      y: rnd(0, H),
      size: Math.max(1, Math.round(pick([1, 1, 1, 1.5, 2]) * dpr)),
      color: pick(["#ffffff", "#ffffff", "#ffffff", "#cfe0ff", "#ffe9d6"]),
      base: rnd(.5, 1),
      ph: rnd(0, 6.28),
      sp: rnd(.0006, .0026),
      drift: rnd(.002, .012) * dpr
    }));
    // На низком экране подпись поднимается, чтобы кнопки оставались в кадре
    dedication.style.top = Math.max(8, Math.min(vh * .6, vh - dedication.offsetHeight - 12)) + "px";
    placeTargets();
  }

  function drawStars(t) {
    const streak = Math.min(9 * dpr, Math.abs(scrollSpeed) * .0016);
    for (const s of stars) {
      // Дальние звёзды при прокрутке сдвигаются меньше ближних: получается глубина
      let y = still ? s.y : (((s.y - t * s.drift - scrollShift * s.drift * 24) % H) + H) % H;
      let x = s.x;
      ctx.fillStyle = s.color;
      ctx.globalAlpha = still ? s.base : s.base * (.7 + .3 * Math.sin(t * s.sp + s.ph));
      if (warp) {
        // Кульминация: звёзды втягивает к центру или выбрасывает от него, за ними тянется след
        for (let i = 3; i > 0; i--) {
          const pull = warp * (1 - i * .16);
          ctx.fillRect(Math.round(x + (x - warpX) * pull), Math.round(y + (y - warpY) * pull), s.size, s.size);
        }
        x += (x - warpX) * warp;
        y += (y - warpY) * warp;
      }
      ctx.fillRect(Math.round(x), Math.round(y), s.size, s.size + streak * s.drift * 60);
    }
    ctx.globalAlpha = 1;
    if (still) return;
    // Несколько звёзд время от времени вспыхивают лучами
    for (let i = 0; i < Math.min(16, stars.length); i++) {
      const s = stars[i], flash = Math.pow(Math.max(0, Math.sin(t * s.sp * .6 + s.ph)), 6);
      if (flash > .05) drawSparkle(s.x, (((s.y - t * s.drift - scrollShift * s.drift * 24) % H) + H) % H, Math.round((2 + 5 * flash) * dpr), flash);
    }
    drawMeteor(t);
  }

  // Сдвиг неба от прокрутки лендинга и от кульминаций истории
  let scrollShift = 0, scrollSpeed = 0, lastScrollTop = 0, warp = 0, warpX = 0, warpY = 0;

  // Пиксельное кольцо, расходящееся от точки: прячет шов между сценами
  function drawShockRing(x, y, e) {
    const radius = easeOut(e) * Math.hypot(W, H) * .42;
    ctx.globalAlpha = (1 - ease(e)) * .55;
    ctx.fillStyle = "#ffd0e3";
    for (let i = 0; i < 130; i++) {
      const angle = i / 130 * 6.2832 + (i % 2) * .02;
      const wobble = 1 + (i % 3) * .012;
      ctx.fillRect(Math.round((x + Math.cos(angle) * radius * wobble) / p) * p, Math.round((y + Math.sin(angle) * radius * wobble * .8) / p) * p, p * 2, p * 2);
    }
    ctx.globalAlpha = 1;
  }

  // Нить от фото к фото: тянется за прокруткой и светится искрой на конце
  function drawThread(alpha) {
    const anchors = threadAnchors;
    if (!anchors.length || alpha <= 0) return;
    const head = H * .72, step = p * 3;
    let headX = 0, headY = -1;
    ctx.fillStyle = "#ff7fb2";
    ctx.globalAlpha = .8 * alpha;
    for (let i = 0; i < anchors.length - 1; i++) {
      const a = anchors[i].getBoundingClientRect(), b = anchors[i + 1].getBoundingClientRect();
      const ax = (a.left + a.width / 2) * dpr, ay = a.bottom * dpr, bx = (b.left + b.width / 2) * dpr, by = b.top * dpr;
      if (ay > head) break;
      if (by < 0) continue;
      const mid = (ay + by) / 2, count = Math.ceil(Math.hypot(bx - ax, by - ay) / step);
      for (let n = 0; n <= count; n++) {
        const t = n / count, u = 1 - t;
        const y = u * u * u * ay + 3 * u * u * t * mid + 3 * u * t * t * mid + t * t * t * by;
        if (y > head) break;
        const x = u * u * u * ax + 3 * u * u * t * ax + 3 * u * t * t * bx + t * t * t * bx;
        headX = x;
        headY = y;
        if (y < 0 || y > H) continue;
        if (n % 2) ctx.fillRect(Math.round(x / p) * p, Math.round(y / p) * p, p, p);
      }
    }
    ctx.globalAlpha = 1;
    if (headY > 0 && headY < head - p) drawSparkle(headX, headY, Math.round(6 * dpr), alpha);
  }

  const threadAnchors = [...landing.querySelectorAll(".row > .frame"), ...landing.querySelectorAll(".ending > svg")];

  /* ===== Первая сцена: сердце из бабочек ===== */
  // Как на видео: из центра вырастает плотное ядро из вложенных сердец, вокруг сердца покрупнее
  // и большой контур-бабочка, крупные бабочки стоят симметрично, вокруг парят остальные.
  const BUTTERFLY_HOLD = 9800, BUTTERFLY_EXIT = 2100;
  // Экранные точки бабочек в момент ухода: отсюда начинают движение пиксели письма
  let flockSpots = [];

  // Гладкая бабочка из четырёх мягких лепестков: сиренево-розовая с коралловыми кончиками
  function wingSprite(side) {
    const sprite = document.createElement("canvas");
    sprite.width = 96;
    sprite.height = 176;
    const c = sprite.getContext("2d");
    const x0 = side < 0 ? 96 : 0, y0 = 88;
    const petal = (cx, cy, rx, ry, angle) => {
      c.save();
      c.translate(x0 + side * cx, y0 + cy);
      c.rotate(side * angle);
      // Цвет идёт от сиреневого у тела к коралловому на кончике лепестка
      const tipY = cy < 0 ? -ry : ry;
      const shade = c.createRadialGradient(0, -tipY * .25, ry * .12, 0, 0, ry * 1.04);
      shade.addColorStop(0, "#fbb6ff");
      shade.addColorStop(.62, "#f48cff");
      shade.addColorStop(.86, "#ff6ea8");
      shade.addColorStop(1, "#ff3a66");
      c.fillStyle = shade;
      c.shadowColor = "rgba(255, 80, 170, .85)";
      c.shadowBlur = 9;
      c.beginPath();
      c.ellipse(0, 0, rx, ry, 0, 0, 6.2832);
      c.fill();
      c.restore();
    };
    petal(34, -36, 29, 44, .4);
    petal(26, 38, 20, 38, -.46);
    return sprite;
  }
  const wingLeft = wingSprite(-1), wingRight = wingSprite(1);

  function drawButterfly(x, y, size, angle, flap, alpha) {
    if (alpha <= 0 || size <= 0) return;
    const fold = .3 + .7 * Math.abs(Math.cos(flap));
    const cos = Math.cos(angle), sin = Math.sin(angle), halfW = size * 8.6 * fold, height = size * 14.4;
    ctx.setTransform(cos, sin, -sin, cos, x, y);
    ctx.globalAlpha = alpha;
    ctx.drawImage(wingLeft, -halfW, -height / 2, halfW, height);
    ctx.drawImage(wingRight, 0, -height / 2, halfW, height);
  }

  function heartPoint(t, scale) {
    const s = Math.sin(t);
    return [
      16 * s * s * s / 17 * scale,
      (-(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17 + .06) * scale
    ];
  }
  // Контур с двумя верхними и двумя нижними крыльями и вырезами сверху и снизу
  function wingsPoint(t) {
    const s = Math.abs(Math.sin(t)), c2 = Math.cos(2 * t);
    const r = .72 + .5 * Math.pow(s, .8) * (1 + .25 * Math.cos(t)) - .25 * c2 * c2;
    return [Math.sin(t) * r, -Math.cos(t) * r * .92];
  }
  const FLOCK = [];
  // Кольца: масштаб сердца (0 это контур-бабочка), число бабочек, размер, задержка появления
  [[.055, 16, .2, 0], [.085, 22, .23, 150], [.125, 30, .26, 320], [.26, 58, .36, 760], [.52, 52, .62, 1500], [0, 84, .86, 2500]].forEach(([scale, count, size, delay]) => {
    for (let i = 0; i < count; i++) {
      FLOCK.push({
        scale, size: size * rnd(.9, 1.1), t0: i / count * 6.2832, drift: scale ? .00004 : .00003,
        delay: delay + rnd(0, 360), flap: rnd(0, 6.28), angle: rnd(-.7, .7), spin: rnd(.0003, .0008), wobble: rnd(0, 6.28)
      });
    }
  });
  // Струйка мелких бабочек от выемки внешнего сердца к ядру
  for (let i = 0; i < 16; i++) {
    FLOCK.push({ column: i / 15, size: .24 + .12 * (i / 15), delay: 1200 + i * 60, flap: rnd(0, 6.28), angle: rnd(-.5, .5), spin: rnd(.0003, .0008), wobble: rnd(0, 6.28) });
  }
  // Крупные бабочки стоят симметрично: по бокам сердец и на нижних кончиках
  [[-.56, -.1, 1.45], [.56, -.1, 1.45], [-.27, -.03, .86], [.27, -.03, .86], [-.125, -.01, .42], [.125, -.01, .42], [0, .5, 1.05], [0, .265, .62]].forEach(([x, y, size], i) => {
    FLOCK.push({ fixedX: x, fixedY: y, size, delay: 1700 + i * 130, flap: rnd(0, 6.28), angle: x * .5, spin: rnd(.0002, .0005), wobble: rnd(0, 6.28), big: true });
  });
  const FLYERS = Array.from({ length: 46 }, (_, i) => ({
    // Только несколько крупных, и они держатся у краёв, чтобы не заслонять сердце
    x: i < 5 ? (i % 2 ? rnd(.02, .14) : rnd(.86, .98)) : Math.random(), y: Math.random(),
    size: i < 5 ? rnd(1.5, 2.1) : rnd(.7, 1.05),
    vx: i < 5 ? 0 : rnd(-.000006, .000006), vy: rnd(-.000011, -.000003),
    sway: rnd(.00025, .0006), ph: rnd(0, 6.28), angle: rnd(-.6, .6),
    flap: rnd(.005, .009), delay: 3000 + Math.random() * 2200
  }));
  const FLOCK_DUST = Array.from({ length: 90 }, () => ({ angle: rnd(0, 6.28), reach: rnd(.12, 1.3), ph: rnd(0, 6.28), sp: rnd(.0008, .003), warm: Math.random() < .45 }));

  function drawFlyers(t, alpha, T, exit, returnSpots) {
    const unit = Math.min(W, H) / 400;
    ctx.imageSmoothingEnabled = true;
    for (const f of FLYERS) {
      const shown = ease(clamp((T - f.delay) / 1600));
      let x = ((((f.x + t * f.vx + Math.sin(t * f.sway + f.ph) * .03) % 1.2) + 1.2) % 1.2 - .1) * W;
      let y = ((((f.y + t * f.vy + Math.cos(t * f.sway * .8 + f.ph) * .025) % 1.2) + 1.2) % 1.2 - .1) * H;
      if (returnSpots) returnSpots.push([x, y]);
      drawButterfly(x, y, unit * f.size * (1 - .4 * ease(exit)), f.angle + Math.sin(t * .0005 + f.ph) * .25, t * f.flap + f.ph, alpha * shown * (1 - ease(exit)));
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
  }

  function drawHeartFlock(T, t, exit, returnSpots) {
    const cx = W / 2, cy = H * .47;
    const R = Math.min(W * .47, H * .46), unit = Math.min(W, H) / 400;
    const breath = 1 + .026 * Math.sin(t * .0009);
    const yaw = Math.sin(t * .00028) * .42, cosYaw = Math.cos(yaw), sinYaw = Math.sin(yaw);

    drawHaze(ease(clamp(T / 2600)) * (1 - ease(exit)) * .85, cx, cy, R * 1.25);

    // Пыльца вокруг фигуры: розовые и коралловые точки
    for (const dot of FLOCK_DUST) {
      const reach = dot.reach * R * ease(clamp(T / 3400));
      ctx.fillStyle = dot.warm ? "#ff9a7a" : "#ff8ae0";
      ctx.globalAlpha = (.25 + .55 * Math.abs(Math.sin(t * dot.sp + dot.ph))) * (1 - ease(exit));
      ctx.fillRect(Math.round(cx + Math.cos(dot.angle + t * .00005) * reach * cosYaw), Math.round(cy + Math.sin(dot.angle + t * .00005) * reach), Math.max(1, dpr), Math.max(1, dpr));
    }
    ctx.globalAlpha = 1;

    ctx.imageSmoothingEnabled = true;
    for (const b of FLOCK) {
      const grown = easeOut(clamp((T - b.delay) / 2000));
      if (grown <= 0) continue;
      let ux, uy;
      if (b.big) {
        ux = b.fixedX;
        uy = b.fixedY + Math.sin(t * .0011 + b.wobble) * .006;
      } else if (b.column !== undefined) {
        ux = Math.sin(t * .001 + b.wobble) * .006;
        uy = mix(-.3, -.05, b.column);
      } else if (b.scale) {
        [ux, uy] = heartPoint(b.t0 + t * b.drift, b.scale);
      } else {
        [ux, uy] = wingsPoint(b.t0 + t * b.drift);
      }
      const depth = 1 + ux * sinYaw * .35;
      let x = cx + ux * R * grown * breath * cosYaw;
      let y = cy + uy * R * grown * breath;
      if (!b.big) y += Math.sin(t * .0014 + b.wobble) * unit * .5;
      let size = unit * b.size * depth;
      let alpha = ease(grown);
      if (returnSpots) returnSpots.push([x, y]);
      // Бабочка тает на месте, а из этой точки выходят пиксели письма
      size *= 1 - .4 * ease(exit);
      alpha *= 1 - ease(exit);
      drawButterfly(x, y, size, b.angle + Math.sin(t * b.spin + b.wobble) * .3, t * (b.big ? .006 : .009) + b.flap, alpha);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    drawFlyers(t, 1, T, exit, returnSpots);
  }

  // Спокойные бабочки после открытия письма: каждая плавно парит вокруг своего места
  const CALM = Array.from({ length: 12 }, (_, i) => ({
    angle: i / 12 * 6.2832 + rnd(-.15, .15), ring: rnd(1.75, 2.35), side: i % 2 ? 1 : -1, row: ((i * 5) % 12 + .5) / 12,
    size: rnd(1.25, 1.75), rx: rnd(.012, .026), ry: rnd(.012, .022), sx: rnd(.00022, .00042), sy: rnd(.00018, .00036),
    ph: rnd(0, 6.28), flap: rnd(.0035, .0055), tilt: rnd(-.35, .35)
  }));
  function drawCalmFlyers(t, alpha, onLanding) {
    if (alpha <= 0) return;
    const unit = Math.min(W, H) / 400;
    ctx.imageSmoothingEnabled = true;
    for (let i = 0; i < CALM.length; i += onLanding ? 2 : 1) {
      const b = CALM[i];
      // В истории они вокруг розы, на лендинге только по краям, чтобы не мешать
      const homeX = onLanding ? (b.side < 0 ? W * .035 : W * .965) : rose.x + Math.cos(b.angle) * rose.r * b.ring;
      const homeY = onLanding ? H * b.row : rose.y - rose.r * .4 + Math.sin(b.angle) * rose.r * b.ring * .85;
      const x = homeX + Math.sin(t * b.sx + b.ph) * W * b.rx;
      const y = homeY + Math.cos(t * b.sy + b.ph) * H * b.ry;
      const lean = b.tilt + Math.sin(t * .00035 + b.ph) * .16;
      drawButterfly(x, y, unit * b.size * (onLanding ? .85 : 1), lean, t * b.flap + b.ph, alpha);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
  }

  /* ===== Цветочки за курсором и сердечки по тапу ===== */
  const SPARKS = [];
  const tinyHeart = document.createElement("canvas");
  tinyHeart.width = HEART[0].length;
  tinyHeart.height = HEART.length;
  {
    const c = tinyHeart.getContext("2d");
    c.fillStyle = "#ff5da0";
    HEART.forEach((row, y) => [...row].forEach((cell, x) => { if (cell === "X") c.fillRect(x, y, 1, 1); }));
  }
  // Маленькие цветочки для следа: те же, что парят между блоками, только без стебля
  const TRAIL_FLOWERS = [
    [AIR_DAISY, { P: "#ffffff", C: "#ffd23f" }],
    [AIR_DAISY, { P: "#ffb0cf", C: "#ffd23f" }],
    [AIR_DAISY, { P: "#ff7fb2", C: "#fff4df" }],
    [AIR_DAISY, { P: "#cdbcff", C: "#ffe27a" }],
    [AIR_ROSE.slice(0, 9), { R: "#e8284f", D: "#9c1236" }],
    [AIR_ROSE.slice(0, 9), { R: "#ff8fbe", D: "#d9477f" }]
  ].map(([rows, palette]) => {
    const sprite = document.createElement("canvas");
    sprite.width = rows[0].length;
    sprite.height = rows.length;
    const c = sprite.getContext("2d");
    rows.forEach((row, y) => [...row].forEach((cell, x) => {
      if (!palette[cell]) return;
      c.fillStyle = palette[cell];
      c.fillRect(x, y, 1, 1);
    }));
    return sprite;
  });
  let lastTrailX = 0, lastTrailY = 0;
  function addTrail(x, y) {
    if (still || Math.hypot(x - lastTrailX, y - lastTrailY) < 24 * dpr) return;
    lastTrailX = x;
    lastTrailY = y;
    if (SPARKS.length < 160) {
      SPARKS.push({ x, y, vx: rnd(-.012, .012) * dpr, vy: rnd(.012, .04) * dpr, born: performance.now(), life: rnd(1000, 1600), sprite: pick(TRAIL_FLOWERS), size: rnd(1.7, 2.8) * dpr, turn: rnd(-.5, .5), spin: rnd(-.0016, .0016) });
    }
  }
  // Сердечки и цветочки разлетаются из-за края кадра
  function popAround(el, count) {
    if (still) return;
    const box = el.getBoundingClientRect(), now = performance.now();
    const cx = box.left + box.width / 2, cy = box.top + box.height / 2;
    for (let i = 0; i < count && SPARKS.length < 190; i++) {
      const onSide = Math.random() < .5, sign = Math.random() < .5 ? -1 : 1;
      const px = onSide ? cx + sign * box.width / 2 : box.left + Math.random() * box.width;
      const py = onSide ? box.top + Math.random() * box.height : cy + sign * box.height / 2;
      const len = Math.hypot(px - cx, py - cy) || 1, speed = rnd(.05, .13) * dpr;
      const vx = (px - cx) / len * speed, vy = (py - cy) / len * speed;
      if (i % 2) SPARKS.push({ x: px * dpr, y: py * dpr, vx, vy, born: now, life: rnd(1000, 1600), sprite: pick(TRAIL_FLOWERS), size: rnd(1.7, 2.8) * dpr, turn: rnd(-.5, .5), spin: rnd(-.002, .002) });
      else SPARKS.push({ x: px * dpr, y: py * dpr, vx, vy, born: now, life: rnd(900, 1400), heart: true, size: Math.round(rnd(1, 2.2)) * Math.max(1, Math.round(dpr)) });
    }
  }
  function bloomFrame(frame) {
    frame.classList.add("bloom");
    frame.addEventListener("animationend", () => frame.classList.remove("bloom"), { once: true });
    popAround(frame, 14);
  }
  function burstHearts(x, y) {
    if (still) return;
    const now = performance.now();
    for (let i = 0; i < 12 && SPARKS.length < 180; i++) {
      const angle = rnd(0, 6.28), speed = rnd(.04, .14) * dpr;
      SPARKS.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - .05 * dpr, born: now, life: rnd(900, 1500), heart: true, size: Math.round(rnd(1, 2.4)) * Math.max(1, Math.round(dpr)) });
    }
  }
  function drawSparks(now, dt) {
    if (!SPARKS.length) return;
    ctx.imageSmoothingEnabled = false;
    const ms = dt * 1000;
    for (let i = SPARKS.length - 1; i >= 0; i--) {
      const s = SPARKS[i], age = (now - s.born) / s.life;
      if (age >= 1) {
        SPARKS.splice(i, 1);
        continue;
      }
      s.x += s.vx * ms;
      s.y += s.vy * ms;
      if (s.heart) s.vy += .00006 * dpr * ms;
      ctx.globalAlpha = 1 - age * age;
      if (s.heart) {
        ctx.drawImage(tinyHeart, Math.round(s.x), Math.round(s.y), tinyHeart.width * s.size, tinyHeart.height * s.size);
      } else {
        // Цветочек раскрывается, плавно падает, поворачиваясь, и тает
        const grown = s.size * easeOut(clamp(age * 7)), w = s.sprite.width * grown, h = s.sprite.height * grown;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.turn + s.spin * (now - s.born));
        ctx.drawImage(s.sprite, -w / 2, -h / 2, w, h);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }

  // Падающая звезда раз в несколько секунд
  function drawMeteor(t) {
    const period = 7500, round = Math.floor(t / period), life = (t % period) / 800;
    if (life >= 1) return;
    const startX = W * (.15 + .6 * ((round * .618) % 1)), startY = H * (.05 + .25 * ((round * .382) % 1));
    const step = p * 2;
    for (let i = 0; i < 18; i++) {
      ctx.globalAlpha = (1 - i / 18) * Math.sin(life * Math.PI);
      ctx.fillStyle = i < 3 ? "#ffffff" : "#ffd9e8";
      const x = startX + life * W * .3 - i * step, y = startY + life * H * .2 - i * step * .67;
      ctx.fillRect(Math.round(x / p) * p, Math.round(y / p) * p, p, p);
    }
    ctx.globalAlpha = 1;
  }

  /* ===== Мягкий конверт и поворот розы ===== */
  // Конверт как мягкая подушка: курсор продавливает его, а след тянется за движением,
  // поэтому вмятина вытягивается по пути курсора и не выглядит ровным кругом.
  const soft = { power: { x: 0, v: 0 }, squash: { x: 0, v: 0 }, headX: MID, headY: GH / 2, tailX: MID, tailY: GH / 2 };
  const REST_PITCH = .42;
  const yaw = { x: 0, v: 0 }, pitch = { x: REST_PITCH, v: 0 }, lean = { x: 0, v: 0 };
  const pointer = { x: MID, y: GH / 2, sx: 0, sy: 0 };
  let pointerNear = false, pressed = false;

  function spring(o, target, dt, stiffness, damping) {
    o.v += (stiffness * (target - o.x) - damping * o.v) * dt;
    o.x += o.v * dt;
  }

  function updateMotion(dt, t) {
    if (still) return;
    const over = scene === "idle" && pointerNear &&
      pointer.x > -6 && pointer.x < GW + 6 && pointer.y > -6 && pointer.y < GH + 6;
    spring(soft.power, pressed ? 1 : over ? .38 : 0, dt, 105, 11);
    spring(soft.squash, pressed ? 1 : 0, dt, 125, 10);
    soft.headX += (pointer.x - soft.headX) * Math.min(1, dt * 30);
    soft.headY += (pointer.y - soft.headY) * Math.min(1, dt * 30);
    soft.tailX += (pointer.x - soft.tailX) * Math.min(1, dt * 6);
    soft.tailY += (pointer.y - soft.tailY) * Math.min(1, dt * 6);

    // Роза клонится и поворачивается туда, где палец или курсор; без них тихо покачивается сама.
    const across = Math.max(-1, Math.min(1, (pointer.sx - W / 2) / (W * .36)));
    const along = Math.max(-1, Math.min(1, (pointer.sy - rose.y) / (H * .4)));
    const idle = Math.sin(t * .0006);
    spring(yaw, pointerNear ? across * .8 : idle * .25, dt, 45, 11);
    spring(lean, pointerNear ? across * .6 : idle * .14, dt, 45, 11);
    spring(pitch, pointerNear ? REST_PITCH + along * .22 : REST_PITCH, dt, 45, 11);
  }

  /* ===== Рисование конверта ===== */
  const PINK = [255, 63, 142];
  function tinted(hex, amount) {
    const n = parseInt(hex.slice(1), 16);
    const r = mix(n >> 16, PINK[0], amount), g = mix((n >> 8) & 255, PINK[1], amount), b = mix(n & 255, PINK[2], amount);
    return `rgb(${r | 0},${g | 0},${b | 0})`;
  }

  function drawLayer(layer, t, bob, { flip = 1, scatter = 0, scale = 1, alpha = 1, tint = 0, gather = 1 } = {}) {
    if (scatter >= 1 || alpha <= 0) return;
    const cx = MID, cy = 76, size = scale > 1.001 ? p * 2 : p;
    const power = soft.power.x, squash = soft.squash.x;
    const sigma = 9 + 13 * Math.max(0, power), spread2 = 2 * sigma * sigma;
    const segX = soft.headX - soft.tailX, segY = soft.headY - soft.tailY;
    const segLen2 = segX * segX + segY * segY;
    let sink = 0;
    const place = px => {
      let gx = px.x, gy = px.y;
      if (scale !== 1) { gx = cx + (gx - cx) * scale; gy = cy + (gy - cy) * scale; }
      gy *= flip;
      if (scatter) {
        gx += px.vx * scatter * 110;
        gy += px.vy * scatter * 110 + scatter * scatter * 60;
      }
      if (gather < 1) {
        // Каждый пиксель выходит из места, где только что была бабочка, и мягко течёт на своё
        const from = flockSpots.length ? flockSpots[px.spot % flockSpots.length] : [px.along * W, px.along * H];
        const swirl = Math.sin(clamp((gather - px.arrival) / (1 - px.arrival)) * Math.PI);
        const e = ease(clamp((gather - px.arrival) / (1 - px.arrival)));
        gx = mix((from[0] - ox) / p + px.vx * 14, gx, e) + px.vy * swirl * 34;
        gy = mix((from[1] - oy) / p + px.vy * 14, gy, e) - px.vx * swirl * 34;
      }
      sink = 0;
      if (Math.abs(power) > .004) {
        // Ближайшая точка на следе курсора: к ней поверхность плавно проседает
        const along = segLen2 > .01 ? clamp(((gx - soft.tailX) * segX + (gy - soft.tailY) * segY) / segLen2) : 1;
        const nearX = soft.tailX + segX * along, nearY = soft.tailY + segY * along;
        const dx = gx - nearX, dy = gy - nearY;
        sink = Math.exp(-(dx * dx + dy * dy) / spread2) * power;
        gx -= dx * sink * .85;
        gy -= dy * sink * .85;
      }
      if (Math.abs(squash) > .001) {
        gx = MID + (gx - MID) * (1 - .04 * squash);
        gy = GH / 2 + (gy - GH / 2) * (1 - .07 * squash);
      }
      return [Math.round(ox + gx * p), Math.round(oy + gy * p) + bob];
    };
    if (layer.glow.length && !scatter && gather > .85) {
      ctx.globalAlpha = .09 * alpha * clamp((gather - .85) / .15);
      ctx.fillStyle = tint ? tinted("#ff9a45", tint) : "#ff9a45";
      for (const px of layer.glow) {
        const [x, y] = place(px);
        ctx.fillRect(x - p, y - p, p * 3, p * 3);
      }
    }
    const shown = alpha * (1 - scatter);
    ctx.globalAlpha = shown;
    for (const [color, list] of layer.buckets) {
      ctx.fillStyle = tint ? tinted(color, tint) : color;
      for (const px of list) {
        if (px.tw && !still && Math.sin(t * px.sp + px.ph) > .72) continue;
        const [x, y] = place(px);
        // Глубина вмятины читается как тень: чем глубже, тем темнее
        ctx.globalAlpha = sink > .02 ? shown * (1 - .62 * Math.min(1, sink)) : shown;
        ctx.fillRect(x, y, size, size);
      }
    }
    ctx.globalAlpha = 1;
  }

  // Сплошной треугольник: flip 1 — тёмное нутро конверта, flip -1 — изнанка поднятого клапана.
  function drawTriangle(bob, flip, color) {
    ctx.fillStyle = color;
    for (let y = 0; y < APEX; y++) {
      const inset = Math.ceil(MID * y / APEX);
      ctx.fillRect(ox + inset * p, oy + Math.round(y * flip) * p + bob, (GW - inset * 2) * p, p);
    }
  }

  // theta — угол клапана (0 закрыт, π поднят), seal — насколько разлетелось сердце,
  // gather — ход интро (0 пиксели за краями экрана, 1 письмо собрано), tint — насколько оно порозовело.
  function drawEnvelope(t, bob, { theta = 0, seal = 0, beat = 1, gather = 1, tint = 0, fade = 1 } = {}) {
    if (fade <= 0) return;
    const flip = Math.cos(theta), lifted = theta > 0;
    const shared = { gather, tint, alpha: fade };
    ctx.globalAlpha = fade;
    if (lifted) drawTriangle(bob, 1, "#26171a");
    if (theta <= Math.PI / 2) {
      if (lifted) drawLayer(layers.rim, t, bob, shared);
      drawLayer(layers.front, t, bob, shared);
      drawLayer(layers.under, t, bob, { alpha: seal * fade, tint });
      drawLayer(layers.flap, t, bob, { flip, ...shared });
      if (lifted) drawLayer(layers.tip, t, bob, { flip, tint, alpha: fade });
    } else {
      ctx.globalAlpha = fade;
      drawTriangle(bob, flip, "#1c1110");
      drawLayer(layers.flap, t, bob, { flip, ...shared });
      drawLayer(layers.tip, t, bob, { flip, tint, alpha: fade });
      drawLayer(layers.rim, t, bob, shared);
      drawLayer(layers.front, t, bob, shared);
      drawLayer(layers.under, t, bob, { alpha: seal * fade, tint });
    }
    drawLayer(layers.seal, t, bob, { scale: seal ? 1 : beat, scatter: seal, gather, alpha: fade });
    drawLayer(layers.label, t, bob, { gather, tint: tint * .75, alpha: fade });
  }

  // Розовый поток: бьёт из центра конверта вверх и выходит через кончик клапана.
  const streamDots = Array.from({ length: 260 }, () => ({ ph: Math.random(), side: rnd(-1, 1), sp: rnd(.8, 1.3) }));
  function drawStream(T, bob, alpha) {
    if (alpha <= 0) return;
    const reach = -78 - 34;
    ctx.globalAlpha = alpha;
    for (const d of streamDots) {
      const life = (d.ph + T * .0011 * d.sp) % 1;
      const gy = mix(APEX, reach, life);
      const gx = MID + d.side * (1.5 + 5 * Math.abs(Math.sin(life * 3.14)));
      ctx.fillStyle = life > .7 ? "#ffd0e3" : "#ff3f8e";
      ctx.fillRect(Math.round(ox + gx * p), Math.round(oy + gy * p) + bob, p, p);
    }
    ctx.globalAlpha = 1;
  }

  /* ===== Частицы: диск, имя, роза ===== */
  const TO_DISC = 3800, TO_NAME = 7400, TO_ROSE = 13000, SHOW_TEXT = 14200, SHOW_REPLAY = 16200;
  // Письмо и частицы какое-то время видны вместе, поэтому резкой смены кадра нет
  const DISC_BLEND = 800;
  const COUNT = Math.min(innerWidth, innerHeight) < 700 ? 4200 : 6000;
  const SMALL_SHARE = .26, STEM_SHARE = .1;
  const SCRIPT = '"Great Vibes", "Snell Roundhand", cursive';
  const PIXEL = '"Press Start 2P", "Courier New", monospace';
  const HOT = ["#ff3f8e", "#ff3f8e", "#ff5da0", "#e82c7a", "#ffa2c8"];
  const PALE = ["#ffe9f1", "#ffc9de", "#ffb4d0", "#ffffff"];
  const MINT = ["#5ef0b8", "#8ff7cf", "#32c792"];
  let parts = [], nameLayer = null, finalLayers = [], disc = { x: 0, y: 0, r: 1 }, rose = { x: 0, y: 0, r: 1, base: 0 };

  function buildParticles() {
    const cells = [];
    for (const layer of [layers.flap, layers.tip, layers.front, layers.under, layers.label]) {
      for (const list of layer.buckets.values()) for (const px of list) cells.push(px);
    }
    const flipFlap = px => px.y <= topLine(px.x) + 1 ? -px.y : px.y;
    parts = Array.from({ length: COUNT }, (_, i) => {
      const cell = cells[Math.floor(Math.random() * cells.length)];
      // диск: плотные кольца вокруг пустого центра, внутренние крутятся быстрее
      const ring = Math.floor(Math.sqrt(Math.random()) * 15) / 15;
      const radius = .14 + .86 * ring + rnd(-.012, .012);
      return {
        cellX: cell.x,
        cellY: flipFlap(cell),
        kind: i < COUNT * SMALL_SHARE ? "small" : i < COUNT * (SMALL_SHARE + STEM_SHARE) ? "stem" : "head",
        dr: radius,
        da: rnd(0, 6.2832),
        dw: .0012 / Math.sqrt(radius),
        d0: rnd(0, 350),
        d2: rnd(0, 550),
        burst: rnd(.4, 1.3),
        burstAngle: rnd(0, 6.28),
        hot: pick(HOT),
        pale: Math.random() < .55 ? pick(PALE) : pick(HOT),
        rc: "#ff3f8e",
        ph: rnd(0, 6.28),
        sp: rnd(.002, .006),
        tw: Math.random() < .2,
        nx: 0, ny: 0, rx: 0, ry: 0, d1: 0
      };
    });
  }

  // Точки внутри текста: рисуем его на скрытом холсте и собираем непрозрачные пиксели.
  function sampleText(text, fontPx, cx, cy, family) {
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = Math.ceil(fontPx * 2);
    const c = canvas.getContext("2d", { willReadFrequently: true });
    c.font = `${fontPx}px ${family}`;
    c.textAlign = "center";
    c.textBaseline = "middle";
    const shine = c.createLinearGradient(0, canvas.height * .15, 0, canvas.height * .85);
    shine.addColorStop(0, "#fff0f6");
    shine.addColorStop(.55, "#ffb0cf");
    shine.addColorStop(1, "#ff5da0");
    c.fillStyle = shine;
    c.fillText(text, W / 2, canvas.height / 2);
    const data = c.getImageData(0, 0, canvas.width, canvas.height).data;
    const points = [];
    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        if (data[(y * canvas.width + x) * 4 + 3] > 130) points.push([x + cx - W / 2, y + cy - canvas.height / 2]);
      }
    }
    return { points, canvas };
  }

  // Сердце из того же рисунка, что на конверте, с такой же блестящей заливкой.
  function sampleHeart(box) {
    const cell = box.width * dpr / HEART[0].length;
    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = Math.ceil(cell * HEART.length) + 2;
    const c = canvas.getContext("2d");
    const shine = c.createLinearGradient(0, 0, 0, canvas.height);
    shine.addColorStop(0, "#fff0f6");
    shine.addColorStop(.55, "#ffb0cf");
    shine.addColorStop(1, "#ff5da0");
    c.fillStyle = shine;
    const left = box.left * dpr, points = [];
    HEART.forEach((row, r) => [...row].forEach((mark, col) => {
      if (mark !== "X") return;
      const x = left + col * cell, y = r * cell;
      c.fillRect(Math.round(x), Math.round(y), Math.ceil(cell), Math.ceil(cell));
      for (let i = 0; i < cell; i += 1) for (let j = 0; j < cell; j += 1) points.push([x + i, box.top * dpr + y + j]);
    }));
    return { points, canvas, y: box.top * dpr };
  }

  function fitFont(text, maxWidth, start) {
    const c = document.createElement("canvas").getContext("2d");
    c.font = `${start}px "Great Vibes", "Snell Roundhand", cursive`;
    return start * Math.min(1, maxWidth / Math.max(1, c.measureText(text).width));
  }

  // Роза в объёме: начало координат в основании бутона, y вверх, z на зрителя, единица — радиус розы.
  // Лепестки идут слоями по золотому углу: внутренние туго свёрнуты, внешние раскрыты и загнуты наружу.
  const STEM_LENGTH = 1.2;
  const PETALS = [];
  [2, 3, 4, 5, 5, 6].forEach((count, layer) => {
    for (let i = 0; i < count; i++) {
      const open = layer / 5;
      PETALS.push({
        open,
        phi: PETALS.length * 2.39996,
        span: mix(.9, .78, open),
        inner: mix(.02, .1, open),
        outer: mix(.12, .78, Math.pow(open, .9)),
        height: mix(1.02, .72, open)
      });
    }
  });

  function rosePetal() {
    const petal = pick(PETALS);
    // Больше точек на контуре: именно он рисует форму лепестка
    const roll = Math.random();
    const rim = roll < .36, side = !rim && roll < .55;
    const u = side ? (Math.random() < .5 ? -1 : 1) * rnd(.93, 1) : rnd(-1, 1);
    const v = (rim ? rnd(.97, 1) : side ? Math.random() : Math.pow(Math.random(), .7) * .96) * (1 - .24 * u * u);
    // Профиль чаши: у основания лепесток быстро расходится вширь, а к верху закругляется внутрь
    const curl = petal.open * Math.pow(v, 6);
    const belly = Math.sin(Math.min(1, v) * Math.PI * .68) / .96;
    const radius = mix(petal.inner, petal.outer, belly) + curl * .1;
    const angle = petal.phi + u * petal.span * (.32 + .68 * v) + (1 - petal.open) * v * .75;
    const lift = petal.height * Math.pow(v, 1.25) - curl * .06;
    let color;
    if (rim) color = pick(PALE);
    else if (side) color = pick(["#ff8fbb", "#ffa2c8"]);
    else if (v < .3 || petal.open < .25) color = pick(["#a01055", "#b8145f", "#c81a6c"]);
    else color = pick(["#d9246f", "#e82c7a", "#ff3f8e"]);
    return [Math.cos(angle) * radius, lift, Math.sin(angle) * radius, color];
  }

  function roseStem() {
    const roll = Math.random();
    if (roll < .08) {
      // Чашелистики под бутоном
      const angle = rnd(0, 6.2832), reach = Math.random() * .26;
      return [Math.cos(angle) * reach, -reach * .35 + .05, Math.sin(angle) * reach, pick(MINT)];
    }
    if (roll < .62) {
      const t = Math.random();
      return [Math.sin(t * 2.2) * .05 + rnd(-.016, .016), -t * STEM_LENGTH, rnd(-.016, .016), pick(MINT)];
    }
    // Два листа: разведены и по сторонам, и по глубине, поэтому при повороте видно объём
    const left = roll < .81, s = Math.random(), attach = left ? -.5 : -.78;
    const side = Math.sin(s * Math.PI) * .1 * (Math.random() < .5 ? 1 : rnd(-1, 1));
    return [
      (left ? -1 : 1) * s * .5 + .05,
      attach + Math.sin(s * Math.PI) * .13 - s * .06 + side,
      (left ? .22 : -.22) * s,
      pick(MINT)
    ];
  }

  // Цели зависят от размера окна, поэтому пересчитываются при каждом изменении раскладки.
  function placeTargets() {
    if (!parts.length || !W || !H || scene === "landing") return;
    const vw = W / dpr, vh = H / dpr;
    disc = { x: W / 2, y: H * .42, r: Math.min(vw * .4, vh * .42, 340) * dpr };
    const R = Math.min(vh * .17, vw * .3, 170) * dpr;
    rose = { x: W / 2, y: H * .34, r: R };

    const bigPx = fitFont(CONFIG.name, W * .84, Math.min(vh * .24, vw * .16, 180) * dpr);
    const big = sampleText(CONFIG.name, bigPx, W / 2, H * .46, '"Great Vibes", "Snell Roundhand", cursive');
    const box = finalName.getBoundingClientRect();
    const smallPx = fitFont(CONFIG.name, W * .9, parseFloat(getComputedStyle(finalName).fontSize) * dpr);
    const nameY = (box.top + box.height / 2) * dpr;
    const small = sampleText(CONFIG.name, smallPx, W / 2, nameY, SCRIPT);
    const whoBox = forWhom.getBoundingClientRect();
    const whoY = (whoBox.top + whoBox.height / 2) * dpr;
    const who = sampleText(CONFIG.forWhom, parseFloat(getComputedStyle(forWhom).fontSize) * dpr, W / 2, whoY, SCRIPT);
    const heart = sampleHeart($("seal").getBoundingClientRect());
    finalLayers = [
      { canvas: who.canvas, y: whoY - who.canvas.height / 2, from: SHOW_TEXT + 500 },
      { canvas: small.canvas, y: nameY - small.canvas.height / 2, from: SHOW_TEXT },
      { canvas: heart.canvas, y: heart.y, from: SHOW_TEXT + 900 }
    ];

    nameLayer = { canvas: big.canvas, y: H * .46 - big.canvas.height / 2 };
    let minX = Infinity, maxX = -Infinity;
    for (const [x] of big.points) { if (x < minX) minX = x; if (x > maxX) maxX = x; }

    for (const part of parts) {
      const target = big.points.length ? pick(big.points) : [W / 2, H / 2];
      part.nx = target[0];
      part.ny = target[1];
      // Имя пишется слева направо
      part.d1 = (part.nx - minX) / Math.max(1, maxX - minX) * 1400 + rnd(0, 180);
      if (part.kind === "small" && small.points.length) {
        // Подпись под розой: блёстки распределены между именем, надписью «For you» и сердцем
        const slot = Math.random();
        const s = pick(slot < .72 ? small.points : slot < .92 ? who.points : heart.points);
        part.rx = s[0];
        part.ry = s[1];
        part.rc = Math.random() < .68 ? pick(PALE) : pick(HOT);
      } else {
        const [lx, ly, lz, color] = part.kind === "stem" ? roseStem() : rosePetal();
        part.lx = lx;
        part.ly = ly;
        part.lz = lz;
        part.rc = color;
      }
    }
  }

  function drawHaze(alpha, x, y, radius, rgb = "255,63,142") {
    if (alpha <= 0) return;
    const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
    gradient.addColorStop(0, `rgba(${rgb},.26)`);
    gradient.addColorStop(.5, `rgba(${rgb},.08)`);
    gradient.addColorStop(1, `rgba(${rgb},0)`);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = gradient;
    ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    ctx.globalAlpha = 1;
  }

  function drawSparkle(x, y, size, alpha) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#ffffff";
    // Просто яркая точка, как звезда: без лучей
    const dot = Math.max(1, Math.round(size / 3));
    ctx.fillRect(Math.round(x - dot / 2), Math.round(y - dot / 2), dot, dot);
    ctx.globalAlpha = 1;
  }

  // Тёплое свечение за конвертом и искры на его углах
  const envelopeHalo = alpha => drawHaze(alpha, ox + GW * p / 2, oy + GH * p / 2, GW * p * .95, "255,150,70");
  const CORNERS = [[1, 1], [218, 1], [218, 134], [1, 134]];
  function drawCornerGlints(t, bob) {
    CORNERS.forEach(([x, y], i) => {
      const flash = Math.pow(Math.max(0, Math.sin(t * .0011 + i * 1.7)), 8);
      if (flash > .05) drawSparkle(ox + x * p, oy + y * p + bob, Math.round((3 + 7 * flash) * dpr), flash);
    });
  }

  // Дополнительные частицы только для диска: он плотный, но имя и роза от этого не тяжелеют.
  const discDust = Array.from({ length: COUNT === 6000 ? 8000 : 5000 }, () => {
    const ring = Math.floor(Math.sqrt(Math.random()) * 15) / 15;
    const radius = .14 + .86 * ring + rnd(-.022, .022);
    return {
      radius,
      angle: rnd(0, 6.2832),
      speed: .0012 / Math.sqrt(radius),
      delay: rnd(0, 500),
      color: Math.random() < .14 ? pick(PALE) : pick(HOT)
    };
  });
  /* ===== Звездопад за воронкой ===== */
  // Путь каждого метеора зависит только от времени, поэтому поток не сбивается при пропуске сцены
  const METEOR_COLORS = [["#ffd0e6", "#ff5da0"], ["#ffe6c2", "#ffb45a"], ["#dcd6ff", "#a07cff"], ["#ffffff", "#ff9cc4"]];
  const PINK_METEORS = [["#ffd0e6", "#ff5da0"], ["#ffffff", "#ff9cc4"], ["#ffc4e4", "#ff7fb2"], ["#ffe3ef", "#e82c7a"]];
  function makeMeteors(count, periodMin, periodMax, lenMin, lenMax, palette = METEOR_COLORS) {
    return Array.from({ length: count }, (_, i) => {
      // Метеоры расходятся веером из одной точки неба, как в настоящем звездопаде
      const u = (i + Math.random()) / count, angle = mix(.86, .36, u) + rnd(-.04, .04), colors = pick(palette);
      return {
        u, phase: (i * .618) % 1,
        period: rnd(periodMin, periodMax), len: rnd(lenMin, lenMax),
        dx: -Math.sin(angle), dy: Math.cos(angle), mid: colors[0], tail: colors[1]
      };
    });
  }
  const bigMeteors = makeMeteors(14, 2300, 3700, .3, .55);
  const smallMeteors = makeMeteors(64, 2800, 5600, .025, .08);
  const meteorGlow = document.createElement("canvas");
  meteorGlow.width = meteorGlow.height = 64;
  {
    const c = meteorGlow.getContext("2d"), glow = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    glow.addColorStop(0, "rgba(255, 244, 250, .95)");
    glow.addColorStop(.28, "rgba(255, 150, 205, .42)");
    glow.addColorStop(1, "rgba(255, 93, 160, 0)");
    c.fillStyle = glow;
    c.fillRect(0, 0, 64, 64);
  }

  function drawMeteorPath(m, T, amount, big) {
    const life = (T / m.period + m.phase) % 1;
    const shine = amount * Math.sin(life * Math.PI);
    if (shine <= .01) return;
    const hx = m.u * (W + H * .75) + m.dx * life * H * 1.6;
    const hy = -H * .1 + m.dy * life * H * 1.6;
    const steps = Math.ceil(m.len * Math.min(W, H) / p);
    // Хвост идёт от головы вверх и вправо. Считаем только то, что попало в кадр и ещё заметно
    const sx = -m.dx * p, sy = m.dy * p;
    const from = Math.max(0, Math.ceil((hy - H - p) / sy), Math.ceil((-p * 2 - hx) / sx));
    const to = Math.min(Math.ceil(steps * (1 - Math.sqrt(.012 / shine))), Math.floor((hy + p * 2) / sy) + 1, Math.floor((W + p - hx) / sx) + 1);
    for (let i = from; i < to; i++) {
      const share = i / steps;
      ctx.globalAlpha = shine * (1 - share) * (1 - share);
      ctx.fillStyle = share < .1 ? "#ffffff" : share < .42 ? m.mid : m.tail;
      const size = big && share < .3 ? p * 2 : p;
      ctx.fillRect(Math.round((hx - m.dx * i * p) / p) * p, Math.round((hy - m.dy * i * p) / p) * p, size, size);
    }
    if (!big) return;
    // Мерцающие искры осыпаются с хвоста, а голова мягко светится
    for (let k = 1; k <= 6; k++) {
      const along = k * steps * p * .13, side = Math.sin(k * 13.7 + m.phase * 50) * p * 5;
      ctx.globalAlpha = shine * (.5 + .5 * Math.sin(T * .012 + k * 2.1)) * (1 - k / 7);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(Math.round((hx - m.dx * along - m.dy * side) / p) * p, Math.round((hy - m.dy * along + m.dx * side) / p) * p, p, p);
    }
    const glowSize = p * 16;
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = shine;
    ctx.drawImage(meteorGlow, hx - glowSize / 2 + p, hy - glowSize / 2 + p, glowSize, glowSize);
    ctx.globalCompositeOperation = "source-over";
  }

  function drawMeteors(T, amount, small, big) {
    if (still || amount <= 0) return;
    for (const m of small) drawMeteorPath(m, T, amount * .8, false);
    for (const m of big) drawMeteorPath(m, T, amount, true);
    ctx.globalAlpha = 1;
  }
  // Розовый звездопад идёт за всем лендингом, а у верхней надписи он ещё гуще
  const landingSmallMeteors = makeMeteors(64, 2800, 5600, .025, .08, PINK_METEORS);
  const landingBigMeteors = makeMeteors(14, 2300, 3700, .3, .55, PINK_METEORS);
  const heroSmallMeteors = makeMeteors(66, 2600, 5200, .025, .08, PINK_METEORS);
  const heroBigMeteors = makeMeteors(12, 2200, 3600, .26, .5, PINK_METEORS);
  function drawLandingMeteors(now, T) {
    const shown = ease(clamp(T / 1400));
    drawMeteors(now, shown, landingSmallMeteors, landingBigMeteors);
    // Высота окна подходит вместо высоты первого экрана: он занимает окно целиком
    if (landingTop < H / dpr) drawMeteors(now, shown * (1 - ease(clamp(landingTop / (H / dpr * .85)))), heroSmallMeteors, heroBigMeteors);
  }

  function drawDiscDust(T, t, ratio) {
    if (T > TO_NAME + 1500) return;
    for (const dot of discDust) {
      const grown = ease(clamp((T - TO_DISC + 200 - dot.delay) / 1900));
      if (grown <= 0) continue;
      const spin = dot.angle + t * dot.speed;
      const r = disc.r * dot.radius * grown;
      const x = disc.x + Math.cos(spin) * r, y = disc.y + Math.sin(spin) * r * ratio;
      // Диск тает слева направо, вслед за тем как пишется имя
      const sweep = clamp((x - (disc.x - disc.r)) / (disc.r * 2));
      const fade = 1 - clamp((T - TO_NAME - sweep * 1400) / 650);
      if (fade <= 0) continue;
      ctx.globalAlpha = fade;
      ctx.fillStyle = dot.color;
      ctx.fillRect(Math.round(x), Math.round(y), p, p);
    }
    ctx.globalAlpha = 1;
  }

  /* ===== Символы через видеокарту ===== */
  // Один проход шейдера заменяет десятки тысяч операций с отдельными символами.
  // Цвет ячейки берётся из маленького холста, символ из атласа. Без WebGL работает прежний код на 2D.
  const ASCII_VERTEX = `attribute vec2 corner;
    varying vec2 uv;
    void main() {
      uv = vec2(corner.x * .5 + .5, .5 - corner.y * .5);
      gl_Position = vec4(corner, 0., 1.);
    }`;
  const ASCII_FRAGMENT = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif
    uniform sampler2D scene, atlas;
    uniform vec2 grid;
    uniform float band, glyphScale, levels, minLight, solid, gapSolid, roundColor, starChance;
    varying vec2 uv;
    float random(vec2 p, float seed) { return fract(sin(dot(p, vec2(12.9898, 78.233)) + seed) * 43758.5453); }
    void main() {
      vec2 spot = uv * grid, cell = floor(spot), inside = spot - cell;
      vec4 color = texture2D(scene, (cell + .5) / grid);
      float light = dot(color.rgb, vec3(.3, .59, .11));
      vec4 empty = vec4(0., 0., 0., solid);
      if (color.a < .235 || light < minLight) {
        gl_FragColor = empty;
        // Редкие звёзды-точки в пустых ячейках
        if (starChance > 0. && random(cell, 7.) < starChance && inside.y * glyphScale <= 1.) {
          float dot = texture2D(atlas, vec2((1. + inside.x) / levels, inside.y * glyphScale)).a / .55;
          gl_FragColor = vec4(vec3(dot), dot);
        }
        return;
      }
      // Между строками остаётся тонкая тёмная линия
      if (inside.y > band) {
        gl_FragColor = vec4(0., 0., 0., max(solid, gapSolid));
        return;
      }
      vec3 rgb = roundColor > .5 ? floor(color.rgb * 255. / 8.) * 8. / 255. : color.rgb;
      float level = clamp(floor((1. - light) * (levels - 2.) + .5) + 2. + floor(random(cell, 0.) * 3.) - 1., 1., levels - 1.);
      float ink = texture2D(atlas, vec2((level + inside.x) / levels, min(inside.y * glyphScale, 1.))).a;
      gl_FragColor = vec4(rgb * (1. - ink), 1.);
    }`;
  function makeAsciiGL(canvas, opaque) {
    let gl = null;
    try {
      gl = canvas.getContext("webgl", { alpha: !opaque, premultipliedAlpha: true, antialias: false, depth: false, stencil: false, powerPreference: "low-power" });
    } catch (error) {}
    if (!gl) return null;
    let spots = {}, sceneTexture = null, atlasTexture = null, lastAtlas = null;
    const makeTexture = filter => {
      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
      return texture;
    };
    function setup() {
      const program = gl.createProgram();
      for (const [type, source] of [[gl.VERTEX_SHADER, ASCII_VERTEX], [gl.FRAGMENT_SHADER, ASCII_FRAGMENT]]) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        gl.attachShader(program, shader);
      }
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return false;
      gl.useProgram(program);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const corner = gl.getAttribLocation(program, "corner");
      gl.enableVertexAttribArray(corner);
      gl.vertexAttribPointer(corner, 2, gl.FLOAT, false, 0, 0);
      spots = {};
      for (const name of ["grid", "band", "glyphScale", "levels", "minLight", "solid", "gapSolid", "roundColor", "starChance", "scene", "atlas"]) spots[name] = gl.getUniformLocation(program, name);
      gl.uniform1i(spots.scene, 0);
      gl.uniform1i(spots.atlas, 1);
      gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
      gl.activeTexture(gl.TEXTURE1);
      atlasTexture = makeTexture(gl.LINEAR);
      gl.activeTexture(gl.TEXTURE0);
      sceneTexture = makeTexture(gl.NEAREST);
      return true;
    }
    if (!setup()) return null;
    const renderer = {
      setAtlas(atlas) {
        lastAtlas = atlas;
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, atlasTexture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlas);
        gl.activeTexture(gl.TEXTURE0);
      },
      draw(scene, { cols, rows, band, glyphScale, minLight = 0, solid = 0, gapSolid = 0, roundColor = 1, starChance = 0 }) {
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, scene);
        gl.uniform2f(spots.grid, cols, rows);
        gl.uniform1f(spots.band, band);
        gl.uniform1f(spots.glyphScale, glyphScale);
        gl.uniform1f(spots.levels, RAMP.length);
        gl.uniform1f(spots.minLight, minLight);
        gl.uniform1f(spots.solid, solid);
        gl.uniform1f(spots.gapSolid, gapSolid);
        gl.uniform1f(spots.roundColor, roundColor);
        gl.uniform1f(spots.starChance, starChance);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      },
      clear() {
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
    };
    // Видеокарта может потерять контекст, например после сна ноутбука
    canvas.addEventListener("webglcontextlost", event => event.preventDefault());
    canvas.addEventListener("webglcontextrestored", () => {
      if (setup() && lastAtlas) renderer.setAtlas(lastAtlas);
    });
    return renderer;
  }
  // Этот холст ещё и проверяет, что WebGL работает, поэтому видимым холстам он нужен только при успехе
  const photoGLCanvas = document.createElement("canvas");
  const photoGL = makeAsciiGL(photoGLCanvas);

  /* ===== Букет лилий из символов внизу лендинга ===== */
  // Сцена рисуется в маленький скрытый холст: один его пиксель равен одному символу,
  // цвет пикселя становится цветом символа, а яркость выбирает сам символ.
  const bouquetCanvas = $("bouquet"), bouquetGL = photoGL && makeAsciiGL(bouquetCanvas), bouquetCtx = bouquetGL ? null : bouquetCanvas.getContext("2d");
  const lowCanvas = document.createElement("canvas");
  const lowCtx = lowCanvas.getContext("2d", { willReadFrequently: true });
  const glyphAtlas = document.createElement("canvas");
  const RAMP = " .,:;-~=+*xoX#%@";
  const BLOOM_END = 5200;
  // Порядок важен: от дальних цветов к ближним. x, y — доли холста, size — доля ширины
  const LILIES = [
    { x: .47, y: .12, size: .16, rot: .3, squash: .72, base: "#6e3b22", mid: "#b98a6a", tip: "#d9b79c" },
    { x: .24, y: .19, size: .17, rot: .9, squash: .85, base: "#7a6a4a", mid: "#cfc6b4", tip: "#eee7da" },
    { x: .72, y: .19, size: .18, rot: .1, squash: .88, base: "#6b4a14", mid: "#b8a23c", tip: "#d8c850" },
    { x: .17, y: .37, size: .17, rot: .4, squash: .9, base: "#6e3a10", mid: "#d0a82c", tip: "#ecd14a" },
    { x: .81, y: .37, size: .18, rot: .55, squash: .9, base: "#4a0f33", mid: "#97245f", tip: "#b83a82" },
    { x: .79, y: .67, size: .18, rot: .2, squash: .85, base: "#2c0508", mid: "#7d0f14", tip: "#a51c20" },
    { x: .16, y: .65, size: .17, rot: .75, squash: .92, base: "#6e4a10", mid: "#c9b13a", tip: "#e6d45a" },
    { x: .47, y: .27, size: .24, rot: .52, squash: .92, base: "#5c0f12", mid: "#d6322e", tip: "#ee4a42" },
    { x: .65, y: .49, size: .25, rot: .15, squash: .95, base: "#6b5f3e", mid: "#cfc7b6", tip: "#f2ece2" },
    { x: .3, y: .5, size: .25, rot: .3, squash: .95, base: "#6a1650", mid: "#c85ab0", tip: "#e58fd6" },
    { x: .47, y: .67, size: .25, rot: .85, squash: .95, base: "#6e3618", mid: "#d3a67e", tip: "#f3dcc4" }
  ].map((lily, i) => ({
    ...lily,
    order: i,
    baseX: .46 + (lily.x - .47) * .24,
    // Раскрываются вразнобой, как на видео: сначала красная и передние
    opens: 2500 + [5, 8, 7, 9, 6, 10, 9, 0, 3, 2, 4][i] * 110,
    specks: Array.from({ length: 46 }, () => [rnd(0, 6.28), rnd(.12, .52), rnd(.5, 1.3)])
  }));
  // Стебли без цветка, с маленькими бутонами на верхушке букета
  const EXTRA_BUDS = [
    { x: .6, y: .015, base: "#5c0f33", tint: "#a0245f" },
    { x: .37, y: .03, base: "#3f5c26", tint: "#7f9c4a" },
    { x: .84, y: .2, base: "#3f5c26", tint: "#8fae55" },
    { x: .13, y: .24, base: "#6e3b22", tint: "#a56a4a" }
  ].map(bud => ({ ...bud, baseX: .46 + (bud.x - .47) * .24 }));
  // Листья: откуда растут, куда смотрят, какой длины
  const LEAVES = [
    [.42, .985, -2.95, .36], [.56, .985, -.16, .33], [.44, .97, -2.5, .3], [.54, .97, -.62, .3],
    [.47, .98, -1.95, .27], [.51, .98, -1.2, .27], [.4, .93, -2.2, .24], [.6, .92, -.92, .25],
    [.36, .86, -2.15, .2], [.64, .85, -1, .2], [.45, .7, -2.25, .17], [.56, .62, -.85, .17],
    [.38, .56, -2.3, .14], [.61, .42, -.8, .14], [.42, .35, -2.25, .12],
    [.4, .985, -3.05, .3], [.58, .985, -.08, .28], [.46, .95, -2.72, .3], [.52, .95, -.4, .3]
  ].map(([x, y, angle, length], i) => ({ x, y, angle, length, grows: 450 + i * 70 }));

  const bouquet = { started: false, start: 0, lastDraw: 0, W: 0, H: 0, cols: 0, rows: 0, fontPx: 0, noise: null, stars: [] };

  // Заготовка с символами: рисовать готовые картинки намного быстрее, чем текст
  function makeGlyphAtlas(cell, fontPx, scale, canvas) {
    const glyphW = Math.ceil(cell * scale), glyphH = Math.ceil(fontPx * scale);
    canvas.width = glyphW * RAMP.length;
    canvas.height = glyphH;
    const atlas = canvas.getContext("2d");
    atlas.font = `500 ${fontPx * scale}px "IBM Plex Mono", "Courier New", monospace`;
    atlas.textBaseline = "top";
    atlas.fillStyle = "rgba(0, 0, 0, .55)";
    [...RAMP].forEach((glyph, i) => atlas.fillText(glyph, i * glyphW, 0));
    return { glyphW, glyphH };
  }

  function sizeBouquet() {
    const box = bouquetCanvas.getBoundingClientRect();
    if (!box.width || (box.width === bouquet.W && box.height === bouquet.H)) return;
    const scale = Math.min(window.devicePixelRatio || 1, 2);
    bouquet.lastDraw = 0;
    bouquet.W = box.width;
    bouquet.H = box.height;
    bouquetCanvas.width = Math.round(box.width * scale);
    bouquetCanvas.height = Math.round(box.height * scale);
    bouquet.cols = box.width > 700 ? 220 : box.width > 500 ? 180 : 140;
    const cell = box.width / bouquet.cols;
    bouquet.fontPx = cell / .6;
    bouquet.rows = Math.floor(box.height / bouquet.fontPx);
    const glyphs = makeGlyphAtlas(cell, bouquet.fontPx, scale, glyphAtlas);
    if (bouquetGL) bouquetGL.setAtlas(glyphAtlas);
    bouquet.glyphW = glyphs.glyphW;
    bouquet.glyphH = glyphs.glyphH;
    lowCanvas.width = bouquet.cols;
    lowCanvas.height = bouquet.rows;
    bouquet.noise = Int8Array.from({ length: bouquet.cols * bouquet.rows }, () => Math.floor(rnd(-1, 2)));
    bouquet.stars = Array.from({ length: 70 }, () => ({
      x: Math.floor(rnd(0, bouquet.cols)), y: Math.floor(rnd(0, bouquet.rows)), glyph: ".", at: rnd(0, 1)
    }));
    if (!bouquetCtx) return;
    bouquetCtx.setTransform(scale, 0, 0, scale, 0, 0);
    bouquetCtx.font = `500 ${bouquet.fontPx}px "IBM Plex Mono", "Courier New", monospace`;
    bouquetCtx.textBaseline = "top";
  }

  function drawPetal(c, length, width, lily, bright) {
    const shade = c.createLinearGradient(0, 0, length, 0);
    shade.addColorStop(0, lily.base);
    shade.addColorStop(.45, lily.mid);
    shade.addColorStop(1, lily.tip);
    c.globalAlpha = bright;
    c.fillStyle = shade;
    // Лепесток с чуть волнистым краем и загнутым кончиком
    const outline = new Path2D();
    outline.moveTo(0, 0);
    outline.bezierCurveTo(length * .18, -width * .95, length * .36, -width * 1.08, length * .5, -width * .96);
    outline.bezierCurveTo(length * .66, -width * .84, length * .74, -width * .66, length, width * .06);
    outline.bezierCurveTo(length * .76, width * .6, length * .64, width * .92, length * .48, width * .98);
    outline.bezierCurveTo(length * .32, width * 1.04, length * .16, width * .9, 0, 0);
    c.fill(outline);
    c.save();
    c.clip(outline);
    // Одна половина в тени: лепесток сложен вдоль срединной жилки
    c.fillStyle = "rgba(20, 0, 10, .2)";
    c.fillRect(0, 0, length, width * 1.2);
    // Светлая полоса вдоль жилки и блик у кромки
    c.strokeStyle = lily.tip;
    c.globalAlpha = bright * .55;
    c.lineWidth = Math.max(1, width * .16);
    c.beginPath();
    c.moveTo(length * .12, -width * .14);
    c.lineTo(length * .86, -width * .02);
    c.stroke();
    c.globalAlpha = bright;
    // Срединная жилка и по три боковых с каждой стороны
    c.strokeStyle = lily.base;
    c.lineWidth = Math.max(1, width * .07);
    c.beginPath();
    c.moveTo(length * .04, 0);
    c.lineTo(length * .94, width * .03);
    for (const side of [-1, 1]) {
      for (const [spread, reach] of [[.34, .86], [.58, .72], [.8, .56]]) {
        c.moveTo(length * .08, 0);
        c.quadraticCurveTo(length * reach * .5, side * width * spread * 1.1, length * reach, side * width * spread * .62);
      }
    }
    c.globalAlpha = bright * .75;
    c.stroke();
    c.restore();
    // Тонкая тёмная кромка отделяет лепестки друг от друга
    c.strokeStyle = lily.base;
    c.lineWidth = Math.max(1, width * .05);
    c.globalAlpha = bright * .6;
    c.stroke(outline);
    c.globalAlpha = 1;
  }

  // open: 0 закрытый бутон, 1 раскрытый цветок
  function drawLily(c, lily, open, size, sway) {
    const W = bouquet.W, H = bouquet.H;
    const length = W * lily.size * (.2 + .8 * open) * size;
    if (length <= 0) return;
    c.save();
    c.translate(lily.x * W + sway, lily.y * H);
    const up = -Math.PI / 2;
    const flat = mix(1, lily.squash, open);
    const bright = mix(.55, 1, open);
    for (const pass of [1, 0]) {
      for (let i = pass; i < 6; i += 2) {
        const opened = lily.rot + i * Math.PI / 3;
        const closed = up + (i - 2.5) * .2;
        const angle = mix(closed, opened, open);
        c.save();
        c.scale(1, flat);
        c.rotate(angle);
        drawPetal(c, length, length * mix(.42, pass ? .2 : .28, open), lily, bright);
        c.restore();
      }
    }
    if (open > .55) {
      const shown = clamp((open - .55) / .45);
      // Тёмное горло, крапинки и тычинки со светлыми пыльниками
      c.globalAlpha = shown;
      c.fillStyle = lily.base;
      c.beginPath();
      c.arc(0, 0, length * .15, 0, 6.2832);
      c.fill();
      c.fillStyle = "#3a0d10";
      for (const [angle, reach, dot] of lily.specks) {
        c.fillRect(Math.cos(angle) * length * reach, Math.sin(angle) * length * reach * flat, dot * 2.2, dot * 1.6);
      }
      for (let i = 0; i < 6; i++) {
        const angle = lily.rot + .4 + i * 1.05, tipX = Math.cos(angle) * length * .42, tipY = Math.sin(angle) * length * .42 * flat;
        // Тычинка с вытянутым пыльником поперёк нити
        c.strokeStyle = "#c7d69a";
        c.lineWidth = Math.max(1, length * .012);
        c.beginPath();
        c.moveTo(0, 0);
        c.quadraticCurveTo(tipX * .5, tipY * .5 - length * .04, tipX, tipY);
        c.stroke();
        c.save();
        c.translate(tipX, tipY);
        c.rotate(angle + Math.PI / 2);
        c.fillStyle = "#8a3b17";
        c.fillRect(-length * .05, -length * .016, length * .1, length * .032);
        c.fillStyle = "#ffcf8f";
        c.fillRect(-length * .04, -length * .016, length * .06, length * .014);
        c.restore();
      }
      // Пестик в центре со светлым рыльцем
      c.strokeStyle = "#a9c27a";
      c.lineWidth = Math.max(1, length * .018);
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(length * .1, -length * .22 * flat);
      c.stroke();
      c.fillStyle = "#f4f0c8";
      c.beginPath();
      c.arc(length * .1, -length * .22 * flat, length * .028, 0, 6.2832);
      c.fill();
      c.globalAlpha = 1;
    }
    c.restore();
  }

  function stemPoint(item, t, sway) {
    const W = bouquet.W, H = bouquet.H;
    const x0 = item.baseX * W, y0 = .985 * H, x2 = item.x * W + sway, y2 = item.y * H;
    const x1 = mix(x0, x2, .35), y1 = mix(y0, y2, .6);
    const u = 1 - t;
    return [u * u * x0 + 2 * u * t * x1 + t * t * x2, u * u * y0 + 2 * u * t * y1 + t * t * y2];
  }

  function drawStem(c, item, grown, sway) {
    if (grown <= 0) return;
    c.strokeStyle = "#6fbf4f";
    c.lineWidth = Math.max(2, bouquet.W * .007);
    c.beginPath();
    for (let i = 0; i <= 24; i++) {
      const [x, y] = stemPoint(item, grown * i / 24, sway);
      if (i) c.lineTo(x, y);
      else c.moveTo(x, y);
    }
    c.stroke();
  }

  function drawLeaf(c, leaf, grown) {
    if (grown <= 0) return;
    const W = bouquet.W, H = bouquet.H, length = W * leaf.length * grown, width = length * .13;
    c.save();
    c.translate(leaf.x * W, leaf.y * H);
    c.rotate(leaf.angle);
    const shade = c.createLinearGradient(0, -width, 0, width);
    shade.addColorStop(0, "#a7dc82");
    shade.addColorStop(.5, "#5da043");
    shade.addColorStop(1, "#3e7c30");
    c.fillStyle = shade;
    c.beginPath();
    c.moveTo(0, 0);
    c.quadraticCurveTo(length * .4, -width * 2, length, width * .6);
    c.quadraticCurveTo(length * .4, width * 1.2, 0, 0);
    c.fill();
    // Светлая срединная жилка и боковые прожилки
    c.strokeStyle = "#c9ee9f";
    c.lineWidth = Math.max(1, width * .14);
    c.beginPath();
    c.moveTo(0, 0);
    c.quadraticCurveTo(length * .45, -width * .45, length * .96, width * .55);
    c.stroke();
    c.strokeStyle = "#2f6626";
    c.lineWidth = Math.max(1, width * .07);
    c.beginPath();
    for (let i = 1; i < 6; i++) {
      const along = i / 6, mid = -width * .45 * Math.sin(along * Math.PI) + width * .4 * along;
      c.moveTo(length * along, mid);
      c.lineTo(length * (along + .1), mid - width * .7);
      c.moveTo(length * along, mid);
      c.lineTo(length * (along + .1), mid + width * .55);
    }
    c.stroke();
    c.restore();
  }

  function renderBouquet(T, t) {
    const { W, H, cols, rows, fontPx, noise, glyphW, glyphH } = bouquet;
    if (!W || !rows) return;
    const c = lowCtx, target = bouquetCtx;
    c.setTransform(cols / W, 0, 0, rows / H, 0, 0);
    c.clearRect(0, 0, W, H);
    c.lineCap = "round";

    const swayOf = i => (still ? 0 : Math.sin(t * .0007 + i) * W * .004);
    // Стебли тянутся снизу вверх, потом растут листья
    [...LILIES, ...EXTRA_BUDS].forEach((item, i) => drawStem(c, item, easeOut(clamp((T - i * 45) / 1100)), swayOf(i)));
    for (const leaf of LEAVES) drawLeaf(c, leaf, easeOut(clamp((T - leaf.grows) / 700)));
    // Бутоны на верхушке букета так и остаются закрытыми
    EXTRA_BUDS.forEach((bud, i) => {
      const size = easeOut(clamp((T - 1500 - i * 90) / 500));
      if (size <= 0) return;
      c.save();
      c.translate(bud.x * W + swayOf(LILIES.length + i), bud.y * H);
      c.fillStyle = bud.tint;
      c.beginPath();
      c.ellipse(0, 0, W * .018 * size, W * .03 * size, 0, 0, 6.2832);
      c.fill();
      c.fillStyle = bud.base;
      c.fillRect(-1, -W * .03 * size, 2, W * .06 * size);
      c.restore();
    });
    // Бутон набухает, затем раскрывается в лилию
    LILIES.forEach((lily, i) => {
      const size = easeOut(clamp((T - 1500 - lily.order * 60) / 650));
      if (size > 0) drawLily(c, lily, ease(clamp((T - lily.opens) / 1100)), size, swayOf(i));
    });

    if (bouquetGL) {
      bouquetGL.draw(lowCanvas, { cols, rows, band: .8, glyphScale: (H / rows) / (fontPx * .86), starChance: 70 / (cols * rows) * clamp((T - 4400) / 900) });
      return;
    }
    const pixels = c.getImageData(0, 0, cols, rows).data;
    target.clearRect(0, 0, W, H);
    const cell = W / cols, rowH = H / rows, band = rowH * .8;
    const cellW = cell + .5;
    let lastColor = -1;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const at = (y * cols + x) * 4, a = pixels[at + 3];
        if (a < 60) continue;
        const r = pixels[at], g = pixels[at + 1], b = pixels[at + 2];
        // Цвет округляется, чтобы реже переключать кисть
        const color = (r >> 3 << 10) | (g >> 3 << 5) | (b >> 3);
        if (color !== lastColor) {
          target.fillStyle = `rgb(${(r >> 3) << 3},${(g >> 3) << 3},${(b >> 3) << 3})`;
          lastColor = color;
        }
        // Цветной блок строки, между строками остаётся тонкая чёрная линия
        const px = x * cell, py = y * rowH;
        target.fillRect(px, py, cellW, band);
        // В блоке вырезан символ: на светлом участке он тоньше, на тёмном плотнее
        const light = (r * .3 + g * .59 + b * .11) / 255;
        const level = Math.min(RAMP.length - 1, Math.max(1, Math.round((1 - light) * (RAMP.length - 2)) + 2 + noise[y * cols + x]));
        target.drawImage(glyphAtlas, level * glyphW, 0, glyphW, glyphH, px, py, cell, fontPx * .86);
      }
    }
    // Звёзды загораются, когда букет раскрылся
    const starsIn = clamp((T - 4400) / 900);
    if (starsIn > 0) {
      target.fillStyle = "#ffffff";
      for (const star of bouquet.stars) {
        if (star.at > starsIn) continue;
        const at = (star.y * cols + star.x) * 4;
        if (pixels[at + 3] < 60) target.fillText(star.glyph, star.x * cell, star.y * fontPx);
      }
    }
  }

  function updateBouquet(now) {
    sizeBouquet();
    const box = bouquetCanvas.getBoundingClientRect();
    const inView = box.top < innerHeight && box.bottom > 0;
    if (!bouquet.started) {
      if (box.top > innerHeight * .75 || !box.width) return;
      bouquet.started = true;
      bouquet.start = now - (still ? BLOOM_END * 1.4 : 0);
    }
    if (!inView) return;
    const T = (now - bouquet.start) * .78;
    if (T < BLOOM_END + 200) busyUntil = now + 60;
    // Пока букет растёт, рисуем чаще; потом он только чуть покачивается
    if (now - bouquet.lastDraw < (T < BLOOM_END + 200 ? 30 : 140)) return;
    if (still && bouquet.lastDraw) return;
    bouquet.lastDraw = now;
    renderBouquet(T, now);
  }

  function resetBouquet() {
    bouquet.started = false;
    bouquet.lastDraw = 0;
    if (bouquetGL) bouquetGL.clear();
    else bouquetCtx.clearRect(0, 0, bouquet.W, bouquet.H);
  }

  /* ===== Фото лендинга: из символов в настоящий снимок ===== */
  // Над каждым фото лежит холст с его же копией из цветных символов. Когда фото попадает в окно,
  // символы растворяются и тают, а снимок под ними становится резким.
  // Ушло за край экрана — незаметно возвращается к символам и при следующем показе играет снова.
  const ASCII_HOLD = 280, ASCII_DISSOLVE = 1750, ASCII_BLUR = 7;
  const samplePhoto = document.createElement("canvas");
  const sampleCtx = samplePhoto.getContext("2d", { willReadFrequently: true });
  const photoGlyphs = document.createElement("canvas");
  const asciiPhotos = still ? [] : [...landing.querySelectorAll(".frame img, .frame video")].map(img => {
    const canvas = document.createElement("canvas");
    canvas.className = "ascii";
    canvas.setAttribute("aria-hidden", "true");
    img.parentElement.append(canvas);
    return { img, canvas, state: "wait", start: 0, cursor: 0, painted: null, plain: false, isVideo: img.tagName === "VIDEO", nearSince: 0 };
  });

  function showRealPhoto(item) {
    item.state = "done";
    item.canvas.hidden = true;
    item.img.style.filter = "";
    item.img.style.willChange = "";
  }

  // Возвращает уже нарисованные символы поверх фото, без пересчёта
  function coverWithAscii(item) {
    const { ctx, canvas, painted, img } = item;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(painted, 0, 0);
    ctx.restore();
    item.cursor = 0;
    item.state = "ready";
    canvas.hidden = false;
    canvas.style.opacity = "1";
    canvas.style.background = "";
    img.style.willChange = "";
    img.style.filter = item.isVideo ? `blur(${ASCII_BLUR}px)` : "";
  }

  // false значит, что фото ещё не готово и нужно попробовать в следующем кадре
  function paintAscii(item) {
    const { img, canvas } = item;
    const w = img.parentElement.clientWidth, h = img.parentElement.clientHeight;
    const isVideo = item.isVideo;
    if ((!isVideo && img.complete && !img.naturalWidth) || (isVideo && img.error)) {
      // Файл не загрузился: не держим поверх него чёрный холст
      item.plain = true;
      showRealPhoto(item);
      return true;
    }
    if (!w || !h || (isVideo ? img.readyState < 2 : !img.complete)) return false;
    const mediaW = isVideo ? img.videoWidth : img.naturalWidth, mediaH = isVideo ? img.videoHeight : img.naturalHeight;
    const scale = Math.min(window.devicePixelRatio || 1, 2);
    const cols = Math.round(w / (w > 500 ? 4.2 : 3.2));
    const cell = w / cols, fontPx = cell / .6, rows = Math.floor(h / fontPx), rowH = h / rows;

  function updateAsciiPhotos(now) {

      if (item.isVideo) {

      canvas.style.opacity = (1 - soft).toFixed(3);

        bloomFrame(item.img.parentElement);
