<title>For You</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Handjet:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Press+Start+2P&display=swap">
<style>
  /* Layout: один экран, всё действие на canvas; текст и кнопки лежат поверх. Намеренно одна тёмная тема. */
  :root {
    --night: #020204;
    --cream: #f2ebe0;
    --copper: #c8784c;
    --copper-hi: #f0a262;
    --copper-deep: #8a4a2c;
    --copper-dark: #4d2414;
    --gold: #ffd79a;
    --ink: #2e1a12;
    --blush: #ffe6f0;
    --pink: #ff3f8e;
    --pink-deep: #c81a6c;
    --font-pixel: "Press Start 2P", "Courier New", monospace;
    --font-script: "Great Vibes", "Snell Roundhand", cursive;
    --font-text: "IBM Plex Mono", "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--cream);
    font-family: var(--font-pixel);
    overflow: hidden;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #intro {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
    pointer-events: none;
  }
  #caption {
    margin: 0;
    font: 400 clamp(9px, 1.1vw, 11px)/1.7 var(--font-pixel);
    letter-spacing: .08em;
    text-transform: uppercase;
    text-align: center;
    text-wrap: balance;
    color: var(--gold);
    text-shadow: 2px 2px 0 var(--copper-dark);
    transition: opacity .5s;
  }
  #caption b { font-weight: 400; color: var(--blush); text-shadow: 2px 2px 0 var(--pink-deep); }
  /* Пиксельная кнопка: ступенчатые углы и толстая нижняя грань, которая уходит при нажатии */
  .btn {
    pointer-events: auto;
    appearance: none;
    cursor: pointer;
    margin: 4px 4px 10px;
    padding: 12px 20px;
    border: 0;
    border-radius: 0;
    background: var(--copper);
    color: var(--ink);
    font: 400 10px/1.3 var(--font-pixel);
    letter-spacing: .08em;
    text-transform: uppercase;
    box-shadow:
      0 -3px 0 var(--copper-hi), -3px 0 0 var(--copper-deep), 3px 0 0 var(--copper-deep),
      0 3px 0 var(--copper-deep), 0 7px 0 var(--copper-dark);
    transition: background-color .1s steps(2), transform .08s steps(2), box-shadow .08s steps(2), opacity .5s;
  }
  .btn:hover { background: var(--copper-hi); transform: translateY(-2px); }
  .btn:active {
    transform: translateY(4px);
    box-shadow:
      0 -3px 0 var(--copper-hi), -3px 0 0 var(--copper-deep), 3px 0 0 var(--copper-deep),
      0 3px 0 var(--copper-deep);
  }
  .btn:focus-visible, .ghost:focus-visible { outline: 2px solid var(--cream); outline-offset: 5px; }

  /* Правый верхний угол: назад и звук */
  #corner {
    position: fixed;
    z-index: 3;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .ghost {
    appearance: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 2px solid transparent;
    background: transparent;
    color: var(--cream);
    font: 400 8px/1 var(--font-pixel);
    letter-spacing: .08em;
    text-transform: uppercase;
    opacity: .8;
    transition: opacity .15s;
  }
  .ghost:hover { opacity: 1; }
  #sound { border-color: rgba(242, 235, 224, .4); }
  #sound svg { width: 14px; height: 14px; display: block; }
  #sound[aria-pressed="true"] { color: var(--blush); border-color: var(--pink); opacity: 1; }
  #sound[aria-pressed="true"] svg { color: var(--pink); }
  #back { background: var(--pink); border-color: var(--pink); border-radius: 0; color: #1c0410; opacity: 1; }
  #back:hover { background: var(--blush); border-color: var(--blush); }
  #startScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: transparent;
    text-align: center;
  }
  #startScreen h1 { position: relative; z-index: 1; margin: 0; color: var(--blush); font: 400 clamp(64px, 15vw, 110px)/1 var(--font-script); text-shadow: 0 0 28px #9c195e; }
  #startButton {
    position: relative;
    z-index: 1;
    appearance: none;
    cursor: pointer;
    padding: 14px 22px;
    border: 2px solid var(--pink);
    border-radius: 0;
    background: var(--pink);
    color: #1c0410;
    font: 400 10px/1 var(--font-pixel);
    text-transform: uppercase;
  }
  #startButton:hover { background: var(--blush); border-color: var(--blush); }
  #startButton:focus-visible { outline: 2px solid var(--cream); outline-offset: 5px; }

  /* Подпись под розой */
  #dedication {
    position: fixed;
    z-index: 2;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
    pointer-events: none;
  }
  /* Подпись рисуется на canvas блестящими пикселями; здесь только её место и текст для скринридеров */
  #forWhom {
    margin: 0;
    font: 400 clamp(24px, 4.4vh, 36px)/1.2 var(--font-script);
    color: transparent;
  }
  #finalName {
    margin: 0;
    font: 400 clamp(46px, min(15vw, 10.5vh), 88px)/1.2 var(--font-script);
    white-space: nowrap;
    color: transparent;
  }
  #seal { width: 26px; height: 24px; display: block; margin-top: clamp(4px, 1vh, 10px); color: transparent; }
  #toLanding { margin-top: clamp(10px, 2.2vh, 22px); }
  #replay { margin-top: 4px; pointer-events: auto; }

  /* Лендинг: листается поверх того же звёздного неба */
  #landing {
    position: fixed;
    inset: 0;
    z-index: 2;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    transition: opacity .6s;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    font-family: var(--font-text);
  }
  #landing:focus { outline: none; }


  /* Мелкие детали */
  ::selection { background: var(--pink); color: #1c0410; }
  #landing { scrollbar-width: thin; scrollbar-color: #ff5da0 transparent; scrollbar-gutter: stable; }
  #landing::-webkit-scrollbar { width: 8px; }
  #landing::-webkit-scrollbar-thumb { background: #ff5da0; }
  #landing::-webkit-scrollbar-track { background: transparent; }
  /* Пиксельная черта под заголовком прочерчивается, когда раздел появился */
  .story h3 { position: relative; }
  .story::after {
    content: "";
    display: block;
    order: 1;
    width: 72px;
    height: 4px;
    margin-top: 18px;
    background: repeating-linear-gradient(90deg, var(--gold) 0 8px, transparent 8px 12px);
    transform-origin: left;
    transform: scaleX(0);
    transition: transform .9s steps(9) .5s;
  }
  .row.in .story::after, #landing:not(.js-reveal) .story::after { transform: scaleX(1); }
  .row.flip .story { justify-self: end; }
  /* Лёгкая виньетка внутри фото связывает снимки с чёрным небом */
  .row > .frame { overflow: visible; }
  .row > .frame > img { box-shadow: none; }
  .frame-shade { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 44px rgba(10, 0, 8, .4); }
  /* Сердце на конце полосы прогресса */
  /* Иностранная фраза и её перевод над описанием */
  .story .story-quote { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
  .story .story-quote b { font: italic 400 clamp(1.3rem, 1.9vw, 1.55rem)/1.2 "Handjet", var(--font-text); letter-spacing: .03em; color: var(--gold); }
  .story .story-quote span { font: 400 clamp(1rem, 1.4vw, 1.15rem)/1.25 "Handjet", var(--font-text); letter-spacing: .02em; color: #ffc4dc; }

  /* Метка записи */
  .video-mark {
    position: absolute;
    z-index: 2;
    top: 12px;
    left: 12px;
    padding: 5px 7px;
    background: rgba(10, 2, 8, .55);
    color: #fff;
    font: 400 8px/1 var(--font-pixel);
    letter-spacing: .08em;
    pointer-events: none;
  }
  .video-mark::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; background: #ff4a5a; animation: rec-blink 1.6s steps(2) infinite; }
  /* Маленькая подпись в самом низу */
  .signoff { margin: clamp(10px, 3vh, 26px) 0 0; font: 400 8px/1.6 var(--font-pixel); letter-spacing: .14em; text-transform: uppercase; color: rgba(255, 215, 154, .7); }
  @media (prefers-reduced-motion: reduce) {
    .video-mark::before { animation: none; }
    .story::after { transition: none; }
  }


  /* Финал с проектором: сцена в один экран, анимация идёт сама, прокрутка на это время закрыта */
  .finale { position: relative; width: 100vw; margin-inline: calc(50% - 50vw); height: 100vh; height: 100dvh; }
  .finale-stage { position: relative; height: 100%; overflow: hidden; background: #000; }
  #finaleCanvas { display: block; width: 100%; height: 100%; }
  /* Ваза с букетом на полке: заполняет место между цветами и сценой с Луной */
  .finale { margin-top: calc(clamp(20px, 6vh, 70px) + max(0px, min(58vw, 62vh) - 44vh) + 22vh); }
  .finale-stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: linear-gradient(180deg, transparent, var(--night)); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  .finale.done .finale-stage::after { opacity: 1; }
  .finale-hint, .finale-note { z-index: 1; }
  #flowerBridge { position: absolute; left: 0; bottom: 100%; display: block; width: 100%; pointer-events: none; }
  .ending { position: relative; z-index: 1; }
  .finale-hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: clamp(14px, 3vh, 26px);
    margin: 0;
    text-align: center;
    font: 400 9px/1.6 var(--font-pixel);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 2px 2px 0 #000;
    opacity: 0;
    transition: opacity .7s;
  }
  .finale-note {
    position: absolute;
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: clamp(48px, 9vh, 80px);
    margin-inline: auto;
    box-sizing: border-box;
    width: min(calc(100% - 32px), 620px);
    padding: clamp(16px, 3vw, 26px);
    text-align: center;
    background: rgba(2, 2, 6, .72);
    box-shadow: 0 -4px 0 #ff5da0, 0 4px 0 #c81a6c, -4px 0 0 #e82c7a, 4px 0 0 #e82c7a;
    visibility: hidden;
    opacity: 0;
  }
  .finale-note.story p { margin-inline: auto; }
  .finale-note.story::after { margin-inline: auto; transform: scaleX(1); }
  .outro { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }



  /* Блок далеко за краем окна или лендинг ещё скрыт: анимаций и их слоёв нет. Запас 240px больше вылета цветов за ряд */
  .away .air-flower, .away .wreath svg, .away .ticker-run, .away .hero-badge svg, .away .hero-name,
  .finale.away .finale-hint, .away .btn::after, .away .video-mark::before { animation-name: none; }
  /* Кнопки карт остаются в порядке Tab, скрыты только их грани */
  .away .mem-back, .away .mem-face { visibility: hidden; }
  .btn.gone::after, #progressCat.gone .cat-body svg { animation-name: none; }

  /* ===== Мелкие детали: котёнок, блики, появление текста ===== */
  /* Котёнок идёт по полосе прокрутки: шагает при движении, сидит и машет хвостом в покое */
  #progressCat { position: fixed; z-index: 4; top: calc(env(safe-area-inset-top, 0px) + 7px); left: 0; width: 45px; height: 30px; pointer-events: none; transition: opacity .4s; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .55)); }
  .cat-body { position: absolute; inset: 0; }
  #progressCat.back .cat-body { transform: scaleX(-1); }
  .cat-body svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  .cat-body .sit-a { opacity: 1; animation: cat-tail-a 2.6s steps(1) infinite; }
  .cat-body .sit-b { animation: cat-tail-b 2.6s steps(1) infinite; }
  #progressCat.walk .cat-body { animation: cat-bob .3s steps(2) infinite; }
  #progressCat.walk .sit-a, #progressCat.walk .sit-b { opacity: 0; animation: none; }
  #progressCat.walk .walk-a { animation: cat-step-a .3s steps(1) infinite; }
  #progressCat.walk .walk-b { animation: cat-step-b .3s steps(1) infinite; }
  @keyframes cat-tail-a { 0%, 100% { opacity: 1; } 70%, 84% { opacity: 0; } }
  @keyframes cat-tail-b { 0%, 100% { opacity: 0; } 70%, 84% { opacity: 1; } }
  @keyframes cat-step-a { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes cat-step-b { 0% { opacity: 0; } 50% { opacity: 1; } }
  @keyframes cat-bob { 0% { transform: translateY(0); } 100% { transform: translateY(-2px); } }
  #progressCat.back.walk .cat-body { animation: cat-bob-back .3s steps(2) infinite; }
  @keyframes cat-bob-back { 0% { transform: scaleX(-1) translateY(0); } 100% { transform: scaleX(-1) translateY(-2px); } }
  .cat-heart { position: absolute; left: 49px; top: 2px; width: 15px; height: 14px; color: #ff7fb2; opacity: 0; transition: opacity .4s; }
  #progressCat.home .cat-heart { opacity: 1; animation: wreath-beat 1.1s steps(4) infinite alternate; }

  /* Глянцевый блик пробегает по большому имени */
  .hero .hero-name, .ending-name {
    background:
      linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, .95) 50%, transparent 58%) 160% 0 / 260% 100% no-repeat,
      linear-gradient(180deg, #fff0f6 0 46%, #ff9cc4 46% 66%, #ff4f9a 66%) 0 0 / 100% 1.45em;
    -webkit-background-clip: text;
    background-clip: text;
    animation: name-shine 7s steps(26) infinite;
  }
  @keyframes name-shine {
    0%, 68% { background-position: 160% 0, 0 0; }
    100% { background-position: -60% 0, 0 0; }
  }

  /* Блик на кнопках */
  .btn { position: relative; overflow: hidden; }
  .btn::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 24%; background: rgba(255, 255, 255, .5); transform: translateX(-170%) skewX(-20deg); pointer-events: none; animation: btn-shine 3.8s steps(14) infinite; }
  @keyframes btn-shine {
    0%, 58% { transform: translateX(-170%) skewX(-20deg); }
    100% { transform: translateX(500%) skewX(-20deg); }
  }

  /* Заголовок печатается пиксельными шагами, описание проявляется следом */
  .js-reveal .row .story h3 { clip-path: inset(-12px 100% -12px -12px); }
  .js-reveal .row.in .story h3 { clip-path: inset(-12px -12px -12px -12px); transition: clip-path .85s steps(20) .45s; }
  .js-reveal .row .story p { opacity: 0; transform: translateY(8px); }
  .js-reveal .row.in .story p { opacity: 1; transform: none; transition: opacity .6s ease 1.05s, transform .6s ease 1.05s; }
  #caption:not(.gone) { animation: caption-type 1s steps(26) both; }
  @keyframes caption-type {
    from { clip-path: inset(-8px 100% -8px -8px); }
    to { clip-path: inset(-8px -8px -8px -8px); }
  }

  /* Фото вспыхивает в момент, когда полностью проявилось */
  .frame.bloom { animation: frame-bloom 1.1s ease; }
  @keyframes frame-bloom {
    0% { filter: brightness(1); }
    28% { filter: brightness(1.2) drop-shadow(0 0 26px rgba(255, 150, 205, .9)); }
    100% { filter: brightness(1) drop-shadow(0 0 0 rgba(255, 150, 205, 0)); }
  }

  /* Победа в игре: карты по очереди подпрыгивают, фраза появляется рывком */
  .memory.won .mem-card { animation: mem-dance .75s steps(7) both; animation-delay: calc(var(--i) * 55ms); }
  @keyframes mem-dance {
    0%, 100% { transform: translateY(0); }
    45% { transform: translateY(-16px) rotate(-2deg); }
  }
  .memory.won .memory-win { animation: win-pop .7s steps(6) both .3s; }
  @keyframes win-pop {
    from { transform: scale(.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* Подсказка покачивается, когда снова можно листать */
  .finale.done .finale-hint { animation: hint-bob 1.1s steps(4) infinite alternate; }
  @keyframes hint-bob { to { transform: translateY(-5px); } }

  @media (prefers-reduced-motion: reduce) {
    .hero .hero-name, .ending-name, .btn::after, #caption:not(.gone), .frame.bloom, .memory.won .mem-card, .memory.won .memory-win, .finale.done .finale-hint, .cat-body svg, #progressCat .cat-body { animation: none !important; }
    .btn::after { content: none; }
  }

  /* Бегущая лента на всю ширину */
  .ticker {
    opacity: .9;
    width: 100vw;
    margin-inline: calc(50% - 50vw);
    overflow: hidden;
    rotate: -2deg;
    padding-block: 12px;
    background: var(--pink);
    color: #1c0410;
    box-shadow: 0 -4px 0 #ffb0cf, 0 4px 0 var(--pink-deep);
  }
  .ticker.gold { rotate: 1.6deg; background: var(--gold); box-shadow: 0 -4px 0 #fff4df, 0 4px 0 #b5722e; }
  .ticker-run {
    display: inline-block;
    white-space: nowrap;
    font: 400 12px/1 var(--font-pixel);
    letter-spacing: .08em;
    animation: ticker-run 48s linear infinite;
  }
  .ticker.gold .ticker-run { animation-direction: reverse; }
  @keyframes ticker-run { to { transform: translateX(-50%); } }

  /* Экран-передышка посреди лендинга */
  .interlude { min-height: 88vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 3vh, 26px); text-align: center; }
  .interlude .hero-name { font-size: clamp(56px, 13vw, 140px); }
  .interlude p { margin: 0; max-width: 34ch; font: 400 clamp(1.5rem, 2.6vw, 2rem)/1.35 "Handjet", var(--font-text); color: #fff; }
  .wreath { display: flex; gap: clamp(12px, 3vw, 28px); align-items: center; }
  .wreath svg { width: clamp(18px, 3vw, 30px); height: clamp(18px, 3vw, 30px); animation: wreath-beat 2.2s steps(6) infinite alternate; }
  .wreath svg:nth-child(even) { animation-delay: -.8s; color: var(--gold); }
  .wreath svg:nth-child(odd) { color: var(--pink); }
  @keyframes wreath-beat { from { transform: scale(.75); opacity: .55; } to { transform: scale(1.1); opacity: 1; } }

  /* Пиксельные стикеры, прилепленные к углу фото */
  /* Цветы, парящие в воздухе в пустых местах между блоками */
  .air { position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity 1.3s ease; --gap: clamp(72px, 13vh, 150px); }
  .row.in .air, #landing:not(.js-reveal) .air { opacity: 1; }
  .air-flower { position: absolute; image-rendering: pixelated; animation: air-sway ease-in-out infinite alternate; }
  @keyframes air-sway {
    from { transform: translate(-7px, 9px) rotate(-8deg); }
    to { transform: translate(9px, -11px) rotate(9deg); }
  }
  @media (prefers-reduced-motion: reduce) { .air-flower { animation: none; } }
  @media (max-width: 720px) { .air-flower.side { display: none; } }

  .sticker {
    position: absolute;
    z-index: 2;
    width: clamp(46px, 7vw, 76px);
    height: auto;
    display: block;
    pointer-events: none;
    filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(4px 5px 0 rgba(0, 0, 0, .6));
  }
  .sticker.tr { top: -26px; right: -22px; rotate: 12deg; }
  .sticker.bl { bottom: -24px; left: -22px; rotate: -12deg; }
  .sticker.br { bottom: -26px; right: -18px; rotate: 9deg; }
  .sticker.tl { top: -26px; left: -20px; rotate: -9deg; }
  .row.in .sticker { animation: sticker-slap .8s steps(8) .45s both; }
  @keyframes sticker-slap { 0% { transform: scale(2.6); opacity: 0; } 60% { transform: scale(.86); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

  /* Мини-игра: найди пары */
  .memory { display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center; }
  .memory .story p { margin-inline: auto; }

  // Один path на цвет вместо отдельного rect на каждый пиксель: картинка та же, узлов в разы меньше
  function pixelPaths(rows, colorOf, size) {
    const paths = new Map();
    rows.forEach((row, r) => {
      for (let c = 0; c < row.length; c++) {
        const color = colorOf(row[c]);
        if (!color) continue;
        let end = c + 1;
        while (end < row.length && colorOf(row[end]) === color) end++;
        paths.set(color, (paths.get(color) || "") + `M${c} ${r}h${end - c - 1 + size}v${size}H${c}z`);
        c = end - 1;
      }
    });
    return [...paths].map(([color, d]) => `<path d="${d}" fill="${color}"/>`).join("");
  }

    memoryGrid.replaceChildren(...deck.map(({ photo }, i) => {
